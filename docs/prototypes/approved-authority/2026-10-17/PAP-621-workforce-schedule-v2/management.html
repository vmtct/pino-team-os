<!doctype html><html lang='vi'><meta charset='utf-8'><title>Workforce · Quản lý</title><style>body{background:#131218;color:#eee;font:15px Segoe UI;padding:35px;max-width:1100px;margin:auto}button,input,select{background:#292533;color:white;border:1px solid #66577c;border-radius:8px;padding:10px;margin:5px}button{cursor:pointer}.primary{background:#7454d6}.card{background:#211e2a;padding:20px;border-radius:12px;margin:16px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.hidden{display:none}a{color:#c5b0ff}label{display:block;margin-top:12px;color:#bbb}h1{font-size:30px}</style><a href='/'>← Xếp ca</a><h1>Thiết lập Workforce</h1><p>TermWeek, kiểm soát tuần và Shift Templates · Prototype độc lập</p><button onclick='tab(0)'>TermWeek & Kiểm soát</button><button onclick='tab(1)'>Mẫu ca</button><section id='weeks'><div class='card'><h2>TermWeek</h2><select id='week'></select><button class='primary' onclick='document.getElementById("newweek").classList.toggle("hidden")'>+ Tạo tuần</button><div id='newweek' class='hidden'><label>Bắt đầu</label><input id='from' type='date'><label>Kết thúc</label><input id='to' type='date'><button onclick='addWeek()'>Tạo</button></div></div><div class='card'><h2>Kiểm soát tuần</h2><div id='status'></div><label>Lý do thay đổi</label><input id='reason' placeholder='Bắt buộc khi thay đổi'><label>Mở lại đến</label><input id='until' type='datetime-local'><p><button onclick='toggle("registration")'>Đóng / mở đăng ký Staff</button><button onclick='toggle("assignment")'>Đóng / mở xếp ca Manager</button><button class='primary' onclick='toggle("final")'>Chốt / mở lại tuần</button></p></div></section><section id='templates' class='hidden'><div class='card'><h2>Tạo / sửa mẫu ca</h2><div class='row'><input id='code' placeholder='Code (EVENING)'><input id='name' placeholder='Tên ca'><input id='start' type='time'><input id='end' type='time'></div><button class='primary' onclick='saveTemplate()'>Lưu mẫu ca</button></div><div id='list'></div></section><script src='/management.js'></script>
