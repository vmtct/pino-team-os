name: PAP-901 Workforce BO Staging One-Shot
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main merge SHA with successful push CI
        required: true
        type: string
      validation_run:
        description: Successful PR Validation push workflow run for approved SHA
        required: true
        type: string
      expected_previous_version:
        description: Current 100 percent Team staging Worker version (CAS)
        required: true
        type: string
      expected_core_version:
        description: Current Core staging Worker version (CAS)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pino-team-staging-worker-mutation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'vmtct/pino-team-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHA: ${{ inputs.approved_sha }}
      PREVIOUS: ${{ inputs.expected_previous_version }}
      CORE_VERSION: ${{ inputs.expected_core_version }}
      ACCOUNT: 952c3c8a236f8e4cbcf6ee10b86ad70c
      WORKER: pino-team-os-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Admit PAP-901 merged main, exact push CI and staging-only artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$GITHUB_SHA" = "$SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$SHA"
          gh api repos/$GITHUB_REPOSITORY/pulls/874 > /tmp/pap901-pr.json
          jq -e --arg sha "93fde0193685cd465f4888c8cc0bc009252c7edd" '.merged==true and .merge_commit_sha==$sha' /tmp/pap901-pr.json
          git merge-base --is-ancestor 93fde0193685cd465f4888c8cc0bc009252c7edd "$SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > /tmp/validation.json
          jq -e --arg sha "$SHA" '.head_sha==$sha and .event=="push" and .conclusion=="success" and .path==".github/workflows/pr-validation.yml"' /tmp/validation.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const c=require('./wrangler.ho-staging.json');
          assert.equal(c.name,'pino-team-os-staging');
          assert.equal(c.main,'worker.ho-staging.mjs');
          assert.equal(c.keep_vars,false);
          assert.equal(c.vars.APP_ENV,'staging');
          assert.equal(c.vars.BO_UI_ONLY,'enabled');
          assert.deepEqual(c.assets.run_worker_first,['/*']);
          assert.ok(!c.routes && !c.route && !c.send_email && !c.d1_databases && !c.r2_buckets);
          assert.ok(c.services.length>0 && c.services.every(s=>s.service==='pino-core-staging'));
          assert.ok(Object.keys(c.vars).every(k=>!/BYPASS|INGRESS/.test(k)));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Verify BO contract, typecheck, build and dry-run
        run: |
          set -euo pipefail
          npm run bo:contract:check
          npm run typecheck
          npm run build
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          node scripts/pap659-package-provenance.mjs .next .open-next/assets
          npx wrangler deploy --dry-run -c wrangler.ho-staging.json
      - name: CAS release, boundary smoke and guarded rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          get() { curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1/deployments?per_page=1"; }
          active() { get "$1" | jq -er 'if .success and (.result.deployments[0].versions|length==1) and .result.deployments[0].versions[0].percentage==100 then .result.deployments[0].versions[0].version_id else error("ambiguous deployment") end'; }
          test "$(active "$WORKER")" = "$PREVIOUS"
          test "$(active pino-core-staging)" = "$CORE_VERSION"
          get "$WORKER" > before.json
          message="pap901-workforce-bo-readonly staging sha=$SHA run=$GITHUB_RUN_ID"
          rollback() {
            current="$(get "$WORKER")" || return 1
            if jq -e --arg message "$message" '.result.deployments[0].annotations["workers/message"]==$message' <<<"$current" >/dev/null; then
              jq -n --arg previous "$PREVIOUS" --arg sha "$SHA" '{strategy:"percentage",versions:[{version_id:$previous,percentage:100}],annotations:{"workers/message":("pap901 guarded rollback from sha="+$sha)}}' > rollback.json
              curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @rollback.json "$api/$WORKER/deployments" | jq -e .success
              test "$(active "$WORKER")" = "$PREVIOUS"
            elif [ "$(active "$WORKER")" != "$PREVIOUS" ]; then
              echo 'Concurrent writer: refusing rollback' >&2
              return 1
            fi
          }
          trap 'result=$?; if [ "$result" -ne 0 ]; then rollback || echo "ROLLBACK_HOLD" >&2; fi; exit "$result"' EXIT
          npx wrangler deploy -c wrangler.ho-staging.json --tag "pap901-${SHA:0:12}" --message "$message"
          get "$WORKER" > after.json
          jq -e --arg message "$message" '.success and .result.deployments[0].annotations["workers/message"]==$message' after.json
          deployed="$(active "$WORKER")"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$WORKER/versions/$deployed" > version.json
          jq -e '.success and ([.result.resources.bindings[]|select(.type=="service")]|length>0 and all(.service=="pino-core-staging")) and ([.result.resources.bindings[]|select(.type=="send_email" or (.name|test("BYPASS|INGRESS")))]|length==0) and ([.result.resources.bindings[]|select(.name=="APP_ENV" and .text=="staging")]|length==1)' version.json
          origin='https://pino-team-os-staging.minhtri-van42.workers.dev'
          for route in workforce-term-weeks workforce-shift-plans workforce-availability workforce-assignments; do
            code="$(curl -sS --max-time 20 -o /tmp/pap901-login -w '%{http_code}' "$origin/bo/$route")"
            test "$code" = 307
          done
          for endpoint in bootstrap global-weeks weekly; do
            code="$(curl -sS --max-time 20 -o /tmp/pap901-anon -w '%{http_code}' "$origin/api/bo/workforce/planning/$endpoint")"
            test "$code" = 401
          done
          code="$(curl -sS --max-time 20 -o /tmp/pap901-ho-denied -w '%{http_code}' "$origin/ho")"
          test "$code" = 404
          curl -fsS --max-time 20 "$origin/api/health" | jq -e '.ok==true and .service=="pino-team-os"'
          digest="$(node -p "require('./.next/pap659-build-provenance.json').digest")"
          curl -fsS --max-time 20 "$origin/pap659-build-provenance.json" | jq -e --arg digest "$digest" '.digest==$digest'
          test "$(active "$WORKER")" = "$deployed"
          test "$(active pino-core-staging)" = "$CORE_VERSION"
          jq -n --arg sourceSha "$SHA" --arg previousVersionId "$PREVIOUS" --arg activeVersionId "$deployed" --arg coreVersion "$CORE_VERSION" --arg runId "$GITHUB_RUN_ID" '{kind:"PAP901_WORKFORCE_BO_STAGING",sourceSha:$sourceSha,previousVersionId:$previousVersionId,activeVersionId:$activeVersionId,coreVersion:$coreVersion,runId:$runId,result:"SERVING_BOUNDARY_PASS",productionMutation:false,authenticatedVisualAcceptance:"PENDING"}' > receipt.json
          cat receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pap901-workforce-bo-staging-receipt
          path: |
            receipt.json
            before.json
            after.json
            rollback.json
          if-no-files-found: warn
