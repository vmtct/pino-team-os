name: Team Access Perimeter Retirement
run-name: "${{ github.event.issue.title == '[GPT] Team Access perimeter retire' && github.event.issue.user.login == 'vmtct' && format('Team Access perimeter retirement #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED Team Access perimeter retirement #{0} @ {1}', github.event.issue.number, github.sha) }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: pino-team-production
  cancel-in-progress: false

jobs:
  retire:
    if: github.event.issue.title == '[GPT] Team Access perimeter retire' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      TOS_AUD: 9cc2708f62a198982d0597f520529a457e2b055c1835f77119a35286ac8de051
      BO_AUD: 7d0d94aa2028f9535283bf0745bfac0cb1cda4e7ebc5e76120fe300718c6559e

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rehome one Access app away from Production
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "Production Access mutation authority is one-shot; open a fresh Founder authorization issue." >&2; exit 1; }
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_ACCESS_TOKEN:-}" -H 'Content-Type: application/json')
          mutated=false; app_id=""; original_payload=""; desired_payload=""; original_state=""; desired_state=""; other_id=""; other_before=""

          comment() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$1"; }
          canonical_app_state() {
            jq -Sc 'del(.created_at,.updated_at) | .allowed_idps=((.allowed_idps // []) | sort) | .policies=((.policies // []) | map(del(.created_at,.updated_at)) | sort_by(.id)) | .self_hosted_domains=((.self_hosted_domains // []) | sort) | .destinations=((.destinations // []) | sort_by(.type,.uri))'
          }
          expected_rehomed_state() {
            local from="$1" to="$2"
            jq -Sc --arg from "$from" --arg to "$to" '.domain=$to | if (.name // "") == $from then .name=$to else . end | if (.self_hosted_domains // []) == [$from] then .self_hosted_domains=[$to] else . end | if (.destinations // []) == [{"type":"public","uri":$from}] then .destinations=[{"type":"public","uri":$to}] else . end'
          }
          rollback() {
            if [ "$mutated" = true ] && [ -n "$app_id" ] && [ -n "$original_payload" ] && [ -n "$desired_payload" ]; then
              local live current current_state response code body restored_apps restored_app restored_state
              live="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}" 2>/dev/null)" || return 1
              current="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$live" | head -1)"
              [ -n "$current" ] || return 1
              current_state="$(canonical_app_state <<<"$current")"
              if [ "$current_state" = "$desired_state" ]; then
                response="$(curl -sS -w '\n%{http_code}' -X PUT "${api}/access/apps/${app_id}" "${auth[@]}" -d "$original_payload" || true)"
                code="${response##*$'\n'}"; body="${response%$'\n'*}"
                [ "$code" = "200" ] || return 1
                jq -e '.success==true' <<<"$body" >/dev/null || return 1
                restored_apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}" 2>/dev/null)" || return 1
                restored_app="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$restored_apps" | head -1)"
                [ -n "$restored_app" ] || return 1
                restored_state="$(canonical_app_state <<<"$restored_app")"
                [ "$restored_state" = "$original_state" ] || return 1
              elif [ "$current_state" != "$original_state" ]; then
                return 1
              fi
            fi
          }
          fail() {
            rollback || true
            comment "TEAM_ACCESS_PERIMETER_RETIRE: **FAIL_SAFE**\n\n$1\n\nIf this run changed the target Access app and it still matched the run-owned desired state, rollback to the captured baseline was attempted. No Worker, Core, D1, Staff, DNS, route, or unrelated Access app mutation was authorized."
            exit 1
          }

          [ -n "${CF_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CF_ACCESS_TOKEN:-}" ] || fail "CF_ACCESS_API_TOKEN unavailable."
          target_sha="$(sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-f]{40})[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          target="$(sed -nE 's/^TARGET:[[:space:]]*(TOS|BO)[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          confirm="$(sed -nE 's/^CONFIRM:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          [ "$confirm" = "RETIRE_TEAM_ACCESS_PERIMETER" ] || fail "Exact confirmation missing."
          [ -n "$target_sha" ] || fail "TEAM_SHA missing."
          [ "$target" = "TOS" ] || [ "$target" = "BO" ] || fail "TARGET must be TOS or BO."

          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$target_sha" = "$main_sha" ] || fail "TEAM_SHA is not current main."
          [ "$GITHUB_SHA" = "$target_sha" ] || fail "Workflow checkout is not exact current main."
          bash scripts/assert-main-validation.sh "$GITHUB_REPOSITORY" "$target_sha" || fail "Current Team main lacks successful exact-head validation."
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Team Access perimeter retire" "$AUTH_BODY_HASH" || fail "Founder issue authority is no longer live/exact."
          bash scripts/assert-no-unresolved-recovery.sh || fail "Another Team production recovery remains unresolved."

          if [ "$target" = "TOS" ]; then
            aud="$TOS_AUD"; host="tos.pinohouse.art"; retired="retired-tos-access.pinohouse.art"; other_aud="$BO_AUD"; protected_path="/dashboard"
          else
            aud="$BO_AUD"; host="bo.pinohouse.art"; retired="retired-bo-access.pinohouse.art"; other_aud="$TOS_AUD"; protected_path="/bo"
          fi

          apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")" || fail "Cannot read Access applications."
          jq -e '.success==true' <<<"$apps" >/dev/null || fail "Access applications API returned failure."
          matches="$(jq -c --arg aud "$aud" '[.result[]? | select((.aud // "") == $aud)]' <<<"$apps")"
          [ "$(jq 'length' <<<"$matches")" -eq 1 ] || fail "Pinned $target Access audience must resolve uniquely."
          app="$(jq -c '.[0]' <<<"$matches")"; app_id="$(jq -r '.id' <<<"$app")"
          [ "$(jq -r '.domain // empty' <<<"$app")" = "$host" ] || fail "Target $target Access app is not bound to expected Production hostname."

          other="$(jq -c --arg aud "$other_aud" '[.result[]? | select((.aud // "") == $aud)] | if length==1 then .[0] else empty end' <<<"$apps")"
          [ -n "$other" ] || fail "Unrelated Team Access app does not resolve uniquely."
          other_id="$(jq -r '.id' <<<"$other")"
          other_before="$(jq -c '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$other")"

          original_payload="$(jq -c '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$app")"
          desired_payload="$(jq -c --arg domain "$retired" '.domain=$domain' <<<"$original_payload")"
          original_state="$(canonical_app_state <<<"$app")"
          desired_state="$(expected_rehomed_state "$host" "$retired" <<<"$original_state")"
          original_b64="$(printf '%s' "$original_payload" | base64 -w0)"
          desired_b64="$(printf '%s' "$desired_payload" | base64 -w0)"
          original_state_b64="$(printf '%s' "$original_state" | base64 -w0)"
          desired_state_b64="$(printf '%s' "$desired_state" | base64 -w0)"
          comment "TEAM_ACCESS_PERIMETER_RETIRE: **RECOVERY_ARMED**\n\nWorkflow run: $GITHUB_RUN_ID\nWorkflow attempt: $GITHUB_RUN_ATTEMPT\nTarget: $target\nApp ID: $app_id\nOriginal app payload b64: $original_b64\nDesired app payload b64: $desired_b64\nOriginal app state b64: $original_state_b64\nDesired app state b64: $desired_state_b64\n\nExact full baseline captured before the Access application PUT."

          mutated=true
          response="$(curl -sS -w '\n%{http_code}' -X PUT "${api}/access/apps/${app_id}" "${auth[@]}" -d "$desired_payload" || true)"
          code="${response##*$'\n'}"; body="${response%$'\n'*}"
          [ "$code" = "200" ] || fail "Cloudflare rejected $target Access retirement (HTTP ${code:-000})."
          jq -e '.success==true' <<<"$body" >/dev/null || fail "Cloudflare did not report successful $target Access retirement."

          verify="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")" || fail "Cannot verify Access applications after retirement."
          current="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$verify" | head -1)"
          [ -n "$current" ] || fail "Target Access app disappeared after retirement."
          current_state="$(canonical_app_state <<<"$current")"
          [ "$current_state" = "$desired_state" ] || fail "Target Access app post-mutation full state does not equal the preserved desired state."
          other_after="$(jq -c --arg id "$other_id" '.result[]? | select(.id==$id) | {domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$verify" | head -1)"
          [ "$other_after" = "$other_before" ] || fail "Unrelated Team Access app changed unexpectedly."

          headers="$RUNNER_TEMP/perimeter-retire.headers"; : > "$headers"
          login_code="$(curl -sS --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' "https://${host}/staff-login" || true)"
          login_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
          [[ "$login_location" != *"cloudflareaccess.com"* ]] || fail "$target /staff-login is still challenged by Cloudflare Access."
          case "$login_code" in 200|307|308) ;; *) fail "$target local Staff login returned unexpected HTTP $login_code after Access retirement.";; esac

          : > "$headers"
          protected_code="$(curl -sS --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' "https://${host}${protected_path}" || true)"
          protected_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
          [ "$protected_code" = "307" ] || fail "$target protected surface did not fail closed to local login (HTTP $protected_code)."
          [ "$protected_location" = "https://${host}/staff-login" ] || fail "$target protected surface did not redirect to the exact local Staff login."

          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Team Access perimeter retire" "$AUTH_BODY_HASH" || fail "Founder issue authority drifted before terminal PASS."
          main_now="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$main_now" = "$target_sha" ] || fail "Team main advanced during Access retirement."

          mutated=false
          comment "TEAM_ACCESS_PERIMETER_RETIRE: **PASS**\n\n- Workflow run: $GITHUB_RUN_ID\n- Workflow attempt: $GITHUB_RUN_ATTEMPT\n- Team source: $target_sha\n- Target: $target\n- Production hostname: $host\n- Access app rehomed to: $retired\n- /staff-login: no Cloudflare Access challenge\n- Protected surface: local 307 -> /staff-login\n- Unrelated Team Access app: unchanged\n\nCloudflare remains DNS/Workers transport only for this hostname; PINO password session is now the authentication boundary."
