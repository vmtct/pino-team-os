name: "PAP-1838 Piner Login FE isolated CI (NO DEPLOY)"
on:
  push:
    branches:
      - feat/pap1838-piner-login-fe-20261111
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pap1838-login-no-deploy
  cancel-in-progress: true
jobs:
  validate:
    name: PAP-1838 secure login UI tests and Piner build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install isolated dependencies only
        run: npm ci --no-audit --no-fund
      - name: Secure returnTo, phone normalization and BFF-only contract
        run: node --test test/pap1838-piner-login-policy.node-test.mjs
      - name: Preserve Piner BFF synthetic security regression
        run: node --test test/pap1837-piner-auth-bff.node-test.mjs
      - name: PINO UI scoped ESLint
        run: npx eslint app/piner/public/login/page.tsx app/piner/public/login/PinerLoginForm.tsx lib/piner-login-policy.ts
      - name: TypeScript contract
        run: npx tsc --noEmit
      - name: Next UI build
        run: npm run build
      - name: OpenNext packaging only; never wrangler deploy
        run: npx opennextjs-cloudflare build
