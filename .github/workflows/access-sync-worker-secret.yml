name: Access Sync Worker Secret

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: access-sync-worker-secret
  cancel-in-progress: false

jobs:
  configure:
    if: github.event.issue.title == '[GPT] Access sync worker secret' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACCESS_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      WORKER_NAME: pino-access-evaluator
    steps:
      - name: Configure dedicated Access API secret
        shell: bash
        run: |
          set -euo pipefail
          fail() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_SYNC_WORKER_SECRET: **FAIL_SAFE**\n\n$1"; exit 1; }
          grep -Eq '^CONFIRM:[[:space:]]*SET_ACCESS_SYNC_SECRET[[:space:]]*$' <<<"$ISSUE_BODY" || fail "Missing explicit confirmation."
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || fail "CF_API_TOKEN unavailable."
          [ -n "${ACCESS_TOKEN:-}" ] || fail "CF_ACCESS_API_TOKEN unavailable."
          printf '%s' "$ACCESS_TOKEN" | npx --yes wrangler@4.127.1 secret put CF_ACCESS_API_TOKEN --name "$WORKER_NAME" >/dev/null
          names="$(npx --yes wrangler@4.127.1 secret list --name "$WORKER_NAME")"
          grep -q 'CF_ACCESS_API_TOKEN' <<<"$names" || fail "Worker secret was not visible after write."
          health="$(curl -fsS 'https://pino-access-evaluator.minhtri-van42.workers.dev/health')" || fail "Evaluator health failed."
          jq -e '.ok==true' <<<"$health" >/dev/null || fail "Evaluator health response invalid."
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_SYNC_WORKER_SECRET: **PASS**\n\n- Worker: ${WORKER_NAME}\n- CF_ACCESS_API_TOKEN: configured as Workers Secret\n- Evaluator health: PASS\n\nSecret value was never written to logs, issues, source, or runtime vars."
