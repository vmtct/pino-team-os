name: Access Sync Worker Secret
run-name: ${{ github.event.issue.title == '[GPT] Access sync worker secret' && github.event.issue.user.login == 'vmtct' && format('Access sync worker secret #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED Access sync worker secret #{0} @ {1}', github.event.issue.number, github.sha) }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: pino-team-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.event.issue.title == '[GPT] Access sync worker secret' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CONTROL_PLANE_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      EVALUATOR_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_EVALUATOR_API_TOKEN }}
      CORE_RELEASE_GH_TOKEN: ${{ secrets.PINO_CORE_RELEASE_READ_TOKEN }}
      WORKER_NAME: pino-access-evaluator
      EVALUATOR_REPO: vmtct/pino-access-evaluator
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create non-serving secret version and promote with recovery ownership
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          api="https://api.cloudflare.com/client/v4"
          secret_file=""
          trap '[ -z "${secret_file:-}" ] || rm -f "$secret_file"' EXIT
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "Evaluator provider authority is one-shot; open a fresh issue instead of rerunning." >&2; exit 1; }
          fail() { gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "ACCESS_SYNC_WORKER_SECRET: **FAIL_SAFE**\n\nWorkflow run: ${GITHUB_RUN_ID}\n$1" || true; exit 1; }
          assert_live_main() {
            [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || return 1
            [ "$(gh api "/repos/${repo}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" ]
          }
          grep -Eq '^CONFIRM:[[:space:]]*SET_ACCESS_SYNC_SECRET[[:space:]]*$' <<<"$ISSUE_BODY" || fail "Missing explicit confirmation."
          mapfile -t evaluator_sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^EVALUATOR_SHA:[[:space:]]*([0-9a-f]{40})[[:space:]]*$/\1/p')
          [ "${#evaluator_sha_lines[@]}" -eq 1 ] || fail "Exactly one EVALUATOR_SHA is required."
          evaluator_sha="${evaluator_sha_lines[0]}"
          evaluator_main="$(git ls-remote "https://github.com/${EVALUATOR_REPO}.git" refs/heads/main | awk '{print $1}')"
          [ -n "$evaluator_main" ] && [ "$evaluator_sha" = "$evaluator_main" ] || fail "Pinned evaluator source is not exact current evaluator main."
          evaluator_dir="$RUNNER_TEMP/access-evaluator-source"
          rm -rf "$evaluator_dir"
          git clone --quiet --no-checkout "https://github.com/${EVALUATOR_REPO}.git" "$evaluator_dir" || fail "Cannot clone evaluator source repository."
          git -C "$evaluator_dir" fetch --quiet --depth=1 origin "$evaluator_sha" || fail "Cannot fetch exact evaluator source."
          git -C "$evaluator_dir" checkout --quiet --detach "$evaluator_sha" || fail "Cannot checkout exact evaluator source."
          [ "$(git -C "$evaluator_dir" rev-parse HEAD)" = "$evaluator_sha" ] && [ -z "$(git -C "$evaluator_dir" status --porcelain)" ] || fail "Evaluator source checkout is not exact/clean."
          npm --prefix "$evaluator_dir" ci >/dev/null || fail "Evaluator dependency install failed."
          npm --prefix "$evaluator_dir" test || fail "Evaluator tests failed."
          npm --prefix "$evaluator_dir" run typecheck || fail "Evaluator typecheck failed."
          [ -n "${CF_ACCOUNT_ID:-}" ] && [ -n "${CF_API_TOKEN:-}" ] || fail "Cloudflare Worker credential unavailable."
          [ -n "${CONTROL_PLANE_ACCESS_TOKEN:-}" ] && [ -n "${EVALUATOR_ACCESS_TOKEN:-}" ] || fail "Control-plane/evaluator credentials unavailable."
          [ "$(printf '%s' "$CONTROL_PLANE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)" != "$(printf '%s' "$EVALUATOR_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)" ] || fail "Evaluator credential must not reuse control-plane Access token."
          unset CONTROL_PLANE_ACCESS_TOKEN
          bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Access sync worker secret" "$AUTH_BODY_HASH" || fail "Authorization issue changed."
          assert_live_main || fail "Team main/source authority drifted."
          bash scripts/assert-main-validation.sh "$repo" "$GITHUB_SHA" || fail "Current Team main lacks successful exact-head validation."
          bash scripts/assert-no-core-verification-in-flight.sh || fail "Core PRE_GA verification/recovery overlaps evaluator secret mutation."
          bash scripts/assert-no-unresolved-recovery.sh || fail "Earlier Team production recovery remains unresolved."

          deployments="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" -H "Authorization: Bearer ${CF_API_TOKEN}")" || fail "Cannot inspect evaluator deployment."
          old_deployment="$(jq -r '.result.deployments[0].id // empty' <<<"$deployments")"
          old_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$deployments" | head -1)"
          [ -n "$old_deployment" ] && [ -n "$old_version" ] || fail "Cannot resolve evaluator serving baseline."

          tag="evaluator-${evaluator_sha:0:12}-team-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}"
          message="Evaluator ${evaluator_sha} Team ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          secret_file="$RUNNER_TEMP/evaluator-secrets-${GITHUB_RUN_ID}.json"
          umask 077
          jq -nc --arg token "$EVALUATOR_ACCESS_TOKEN" '{CF_ACCESS_API_TOKEN:$token}' > "$secret_file" || fail "Cannot stage evaluator secret file."
          unset EVALUATOR_ACCESS_TOKEN
          set +e
          (
            cd "$evaluator_dir"
            CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@4.127.1 versions upload --secrets-file "$secret_file" --tag "$tag" --message "$message" >/dev/null
          )
          upload_rc=$?
          set -e
          rm -f "$secret_file"; secret_file=""
          [ "$upload_rc" -eq 0 ] || fail "Could not atomically upload exact evaluator code plus secret as a non-serving version."
          versions="$(CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@4.127.1 versions list --name "$WORKER_NAME" --json)" || fail "Cannot list evaluator versions."
          candidate="$(jq -r --arg tag "$tag" --arg msg "$message" '[.[] | select(.annotations["workers/tag"]==$tag and .annotations["workers/message"]==$msg)] | if length==1 then .[0].id else empty end' <<<"$versions")"
          [ -n "$candidate" ] || fail "Exactly one exact-source evaluator candidate version is required."
          candidate_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions/${candidate}" -H "Authorization: Bearer ${CF_API_TOKEN}")" || fail "Cannot inspect exact evaluator candidate version."
          jq -e '.success==true' <<<"$candidate_detail" >/dev/null || fail "Cloudflare did not return exact evaluator candidate version."
          script_etag="$(jq -r '.result.resources.script.etag // empty' <<<"$candidate_detail")"
          [ -n "$script_etag" ] || fail "Evaluator candidate lacks immutable script etag."
          jq -e '[.result.resources.bindings[]? | select(.name=="CF_ACCESS_API_TOKEN" and .type=="secret_text")] | length==1' <<<"$candidate_detail" >/dev/null || fail "Exact evaluator candidate does not contain the dedicated Access secret binding."

          bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Access sync worker secret" "$AUTH_BODY_HASH" || fail "Authorization changed before promotion."
          assert_live_main || fail "Team main changed before evaluator promotion."
          [ "$(git ls-remote "https://github.com/${EVALUATOR_REPO}.git" refs/heads/main | awk '{print $1}')" = "$evaluator_sha" ] || fail "Evaluator source authority drifted before promotion."
          bash scripts/assert-no-core-verification-in-flight.sh || fail "Core PRE_GA verification/recovery overlaps evaluator promotion."
          nonce="$(cat /proc/sys/kernel/random/uuid)"; [[ "$nonce" =~ ^[0-9a-f-]{36}$ ]] || fail "Cannot create recovery nonce."
          marker="PINO_ACCESS_SECRET:${GITHUB_SHA}:${evaluator_sha}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${nonce}"
          gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "ACCESS_SYNC_WORKER_SECRET: **RECOVERY_ARMED**\n\nWorkflow run: ${GITHUB_RUN_ID}\nWorkflow attempt: ${GITHUB_RUN_ATTEMPT}\nTeam source: ${GITHUB_SHA}\nEvaluator source: ${evaluator_sha}\nEvaluator version tag: ${tag}\nEvaluator script etag: ${script_etag}\nOld deployment ID: ${old_deployment}\nOld version ID: ${old_version}\nCandidate version ID: ${candidate}\nDeployment marker: ${marker}\n\nExact evaluator code and dedicated secret are bound in one immutable non-serving version before recovery ownership is persisted." >/dev/null \
            || fail "Could not persist evaluator recovery identity."
          set +e
          CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@4.127.1 versions deploy "${candidate}@100%" --name "$WORKER_NAME" --message "$marker" -y >/dev/null
          deploy_rc=$?
          set -e
          [ "$deploy_rc" -eq 0 ] || fail "Evaluator candidate promotion failed after recovery was armed."

          after="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" -H "Authorization: Bearer ${CF_API_TOKEN}")" || fail "Cannot verify evaluator deployment."
          evaluator_deployment="$(jq -r '.result.deployments[0].id // empty' <<<"$after")"
          [ -n "$evaluator_deployment" ] || fail "Evaluator deployment ID is unavailable after promotion."
          [ "$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$after" | head -1)" = "$candidate" ] || fail "Evaluator candidate is not serving at 100%."
          [ "$(jq -r '.result.deployments[0].annotations["workers/message"] // empty' <<<"$after")" = "$marker" ] || fail "Evaluator deployment marker does not prove exact run ownership."
          health="$(curl -fsS 'https://pino-access-evaluator.minhtri-van42.workers.dev/health')" || fail "Evaluator health failed after promotion."
          jq -e '.ok==true' <<<"$health" >/dev/null || fail "Evaluator health response invalid."
          bash scripts/assert-live-issue-authority.sh "$repo" "$ISSUE_NUMBER" "[GPT] Access sync worker secret" "$AUTH_BODY_HASH" || fail "Authorization changed before PASS."
          assert_live_main || fail "Team main changed before PASS."
          [ "$(git ls-remote "https://github.com/${EVALUATOR_REPO}.git" refs/heads/main | awk '{print $1}')" = "$evaluator_sha" ] || fail "Evaluator source authority drifted before PASS."
          bash scripts/assert-no-core-verification-in-flight.sh || fail "Core PRE_GA verification/recovery overlaps terminal evaluator evidence."
          gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "ACCESS_SYNC_WORKER_SECRET: **PASS**\n\nWorkflow run: ${GITHUB_RUN_ID}\nWorkflow attempt: ${GITHUB_RUN_ATTEMPT}\nTeam source: ${GITHUB_SHA}\nEvaluator source: ${evaluator_sha}\nEvaluator version tag: ${tag}\nEvaluator script etag: ${script_etag}\nAuthorization body hash: ${AUTH_BODY_HASH}\nEvaluator version: ${candidate}\nEvaluator deployment: ${evaluator_deployment}\nEvaluator deployment marker: ${marker}\nControl-plane token reuse: REFUSED\nEvaluator health: PASS\n\nExact evaluator source, immutable Worker version, dedicated secret, and serving deployment are bound by canonical recovery-owned evidence." >/dev/null
