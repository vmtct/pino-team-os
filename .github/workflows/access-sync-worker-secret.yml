name: Access Sync Worker Secret

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: pino-team-production
  cancel-in-progress: false

jobs:
  configure:
    if: github.event.issue.title == '[GPT] Access sync worker secret' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CONTROL_PLANE_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      EVALUATOR_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_EVALUATOR_API_TOKEN }}
      WORKER_NAME: pino-access-evaluator
    steps:
      - name: Configure dedicated Access API secret
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          echo "AUTH_BODY_HASH=$AUTH_BODY_HASH" >> "$GITHUB_ENV"
          fail() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_SYNC_WORKER_SECRET: **FAIL_SAFE**\n\n$1"; exit 1; }
          grep -Eq '^CONFIRM:[[:space:]]*SET_ACCESS_SYNC_SECRET[[:space:]]*$' <<<"$ISSUE_BODY" || fail "Missing explicit confirmation."
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || fail "CF_API_TOKEN unavailable."
          [ -n "${CONTROL_PLANE_ACCESS_TOKEN:-}" ] || fail "CF_ACCESS_API_TOKEN control-plane credential unavailable."
          [ -n "${EVALUATOR_ACCESS_TOKEN:-}" ] || fail "Dedicated CF_ACCESS_EVALUATOR_API_TOKEN runtime credential unavailable."
          control_hash="$(printf '%s' "$CONTROL_PLANE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          evaluator_hash="$(printf '%s' "$EVALUATOR_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          [ "$control_hash" != "$evaluator_hash" ] || fail "Evaluator runtime credential must not reuse the control-plane Access token."
          unset CONTROL_PLANE_ACCESS_TOKEN control_hash evaluator_hash
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Access sync worker secret" "$AUTH_BODY_HASH"
          printf '%s' "$EVALUATOR_ACCESS_TOKEN" | npx --yes wrangler@4.127.1 secret put CF_ACCESS_API_TOKEN --name "$WORKER_NAME" >/dev/null
          unset EVALUATOR_ACCESS_TOKEN
          names="$(npx --yes wrangler@4.127.1 secret list --name "$WORKER_NAME")"
          grep -q 'CF_ACCESS_API_TOKEN' <<<"$names" || fail "Worker secret was not visible after write."
          health="$(curl -fsS 'https://pino-access-evaluator.minhtri-van42.workers.dev/health')" || fail "Evaluator health failed."
          jq -e '.ok==true' <<<"$health" >/dev/null || fail "Evaluator health response invalid."
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Access sync worker secret" "$AUTH_BODY_HASH"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_SYNC_WORKER_SECRET: **PASS**\n\n- Worker: ${WORKER_NAME}\n- CF_ACCESS_API_TOKEN: configured from dedicated evaluator runtime credential\n- Control-plane token reuse: REFUSED\n- Evaluator health: PASS\n\nSecret value was never written to logs, issues, source, or runtime vars."
