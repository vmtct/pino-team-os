name: Team Access Control Recovery Watchdog

on:
  workflow_run:
    workflows:
      - Access Sync Worker Secret
      - BO Manager Access Reconcile
      - TOS Google IdP Reconcile
      - TOS Canonical External Evaluation
      - Team Access Perimeter Retirement
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: pino-team-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.actor.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCESS_API_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      CORE_RELEASE_GH_TOKEN: ${{ secrets.PINO_CORE_RELEASE_READ_TOKEN }}
    steps:
      - name: Checkout exact failed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Reconcile exact run-owned Access mutation
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_id='${{ github.event.workflow_run.id }}'
          run_attempt='${{ github.event.workflow_run.run_attempt }}'
          sha='${{ github.event.workflow_run.head_sha }}'
          workflow='${{ github.event.workflow_run.name }}'
          display='${{ github.event.workflow_run.display_title }}'
          case "$workflow" in
            'Access Sync Worker Secret'|'Access sync worker secret #'*)
              issue="$(sed -nE "s/^Access sync worker secret #([1-9][0-9]*) @ ${sha}$/\\1/p" <<<"$display")"; prefix=ACCESS_SYNC_WORKER_SECRET; mode=worker ;;
            'BO Manager Access Reconcile'|'BO manager Access reconcile #'*)
              issue="$(sed -nE "s/^BO manager Access reconcile #([1-9][0-9]*) @ ${sha}$/\\1/p" <<<"$display")"; prefix=BO_MANAGER_ACCESS_RECONCILE; mode=bo ;;
            'TOS Google IdP Reconcile'|'TOS Google IdP reconcile #'*)
              issue="$(sed -nE "s/^TOS Google IdP reconcile #([1-9][0-9]*) @ ${sha}$/\\1/p" <<<"$display")"; prefix=TOS_GOOGLE_IDP_RECONCILE; mode=idp ;;
            'TOS Canonical External Evaluation'|'TOS canonical external evaluation #'*)
              issue="$(sed -nE "s/^TOS canonical external evaluation #([1-9][0-9]*) @ ${sha}$/\\1/p" <<<"$display")"; prefix=TOS_CANONICAL_EXTERNAL_EVAL; mode=eval ;;
            'Team Access Perimeter Retirement')
              issue="$(sed -nE "s/^Team Access perimeter retirement #([1-9][0-9]*) @ ${sha}$/\\1/p" <<<"$display")"; prefix=TEAM_ACCESS_PERIMETER_RETIRE; mode=app ;;
            *) exit 0 ;;
          esac
          [ -n "$issue" ] || { echo "Cannot bind failed Access run to one canonical issue" >&2; exit 1; }
          comments="$(gh api --paginate --slurp "/repos/${repo}/issues/${issue}/comments?per_page=100")"
          marker="$(jq -c --arg p "$prefix" --arg run "$run_id" '[.[][] | select(.user.login=="github-actions[bot]") | . + {normalizedBody:((.body // "") | gsub("\\\\n"; "\n"))} | select(.normalizedBody | startswith($p + ": **RECOVERY_ARMED**")) | select(.normalizedBody | test("(^|\\n)-?[[:space:]]*Workflow run:[[:space:]]*" + $run + "[[:space:]]*($|\\n)"))] | sort_by(.created_at) | last // empty' <<<"$comments")"
          [ -n "$marker" ] || { echo "No durable Access recovery marker; no external commit was authorized"; exit 0; }
          body="$(jq -r '.body | gsub("\\\\n"; "\n")' <<<"$marker")"
          recovery_attempt="$(sed -nE 's/^Workflow attempt:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p' <<<"$body")"
          if [ -z "$recovery_attempt" ] && [ "$run_attempt" = "1" ]; then recovery_attempt=1; fi
          [ -n "$recovery_attempt" ] || { echo "Recovery marker is missing canonical workflow attempt identity" >&2; exit 1; }
          armed_run="$(gh api "/repos/${repo}/actions/runs/${run_id}/attempts/${recovery_attempt}")" || { echo "Cannot resolve authoritative armed workflow attempt" >&2; exit 1; }
          armed_conclusion="$(jq -r '.conclusion // empty' <<<"$armed_run")"
          [ -n "$armed_conclusion" ] || { echo "Armed workflow attempt is not terminal" >&2; exit 1; }
          [ "$armed_conclusion" != "success" ] || { echo "Armed workflow attempt already succeeded; recovery is not authorized"; exit 0; }
          pass_receipts="$(jq -r --arg p "$prefix" --arg run "$run_id" --arg attempt "$recovery_attempt" '[.[][] | select(.user.login=="github-actions[bot]") | ((.body // "") | gsub("\\\\n"; "\n")) as $b | select($b | startswith($p + ": **PASS**")) | select($b | test("(^|\\n)-?[[:space:]]*Workflow run:[[:space:]]*" + $run + "[[:space:]]*($|\\n)")) | select(($b | test("(^|\\n)-?[[:space:]]*Workflow attempt:[[:space:]]*" + $attempt + "[[:space:]]*($|\\n)")) or ($attempt=="1" and (($b | test("(^|\\n)Workflow attempt:"))|not)))] | length' <<<"$comments")"
          [ "$pass_receipts" -eq 0 ] || { echo "Armed workflow attempt already has durable PASS evidence; recovery is not authorized"; exit 0; }
          recovered_receipts="$(jq -r --arg p "$prefix" --arg run "$run_id" --arg attempt "$recovery_attempt" '[.[][] | select(.user.login=="github-actions[bot]") | ((.body // "") | gsub("\\\\n"; "\n")) as $b | select(($b | startswith($p + ": **WATCHDOG_RECOVERED**")) or ($b | startswith($p + ": **WATCHDOG_RECOVERY_CONFIRMED**"))) | select($b | test("(^|\\n)-?[[:space:]]*Workflow run:[[:space:]]*" + $run + "[[:space:]]*($|\\n)")) | select($b | test("(^|\\n)-?[[:space:]]*Workflow attempt:[[:space:]]*" + $attempt + "[[:space:]]*($|\\n)"))] | length' <<<"$comments")"
          [ "$recovered_receipts" -eq 0 ] || { echo "Armed workflow attempt already has durable WATCHDOG_RECOVERED evidence; recovery is not authorized"; exit 0; }

          overlap_clear=0
          for _ in $(seq 1 24); do
            if bash scripts/assert-no-core-verification-in-flight.sh; then overlap_clear=1; break; fi
            sleep 5
          done
          [ "$overlap_clear" -eq 1 ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nRecovery remains armed but is deferred while Core PRE_GA verification/recovery is active."; exit 1; }

          case "$mode" in
            worker)
              old_deployment="$(sed -nE 's/^Old deployment ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              old_version="$(sed -nE 's/^Old version ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              candidate="$(sed -nE 's/^Candidate version ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              marker_value="$(sed -nE 's/^Deployment marker:[[:space:]]*(PINO_ACCESS_SECRET:[^[:space:]]+)[[:space:]]*$/\1/p' <<<"$body")"
              [ -n "$old_deployment" ] && [ -n "$old_version" ] && [ -n "$candidate" ] && [ -n "$marker_value" ] || { echo "Malformed evaluator recovery marker" >&2; exit 1; }
              result="$(CF_ACCOUNT_ID="$CF_ACCOUNT_ID" CF_API_TOKEN="$CF_API_TOKEN" bash scripts/recover-worker-promotion.sh pino-access-evaluator "$old_deployment" "$old_version" "$candidate" "$marker_value" access)" || exit $?
              ;;
            bo)
              base="$(sed -nE 's/^Access base:[[:space:]]*(accounts\/[0-9a-f]+|zones\/[0-9a-f]+)[[:space:]]*$/\1/p' <<<"$body")"
              app_id="$(sed -nE 's/^App ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              recovery_policy_name="$(sed -nE 's/^Recovery policy name:[[:space:]]*(.+)[[:space:]]*$/\1/p' <<<"$body")"
              mutation_payload_b64="$(sed -nE 's/^Mutation policy payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              baseline_policies_state_b64="$(sed -nE 's/^Rollback baseline policies state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              [ -n "$base" ] && [ -n "$app_id" ] && [ -n "$recovery_policy_name" ] && [ -n "$mutation_payload_b64" ] && [ -n "$baseline_policies_state_b64" ] || { echo "Malformed BO recovery marker" >&2; exit 1; }
              [[ "$recovery_policy_name" == *"[run:${run_id}][attempt:${recovery_attempt}]" ]] || { echo "BO recovery policy name is not run-owned" >&2; exit 1; }
              state_marker="$(jq -c --arg p "$prefix" --arg run "$run_id" --arg attempt "$recovery_attempt" '[.[][] | select(.user.login=="github-actions[bot]") | . + {normalizedBody:((.body // "") | gsub("\\\\n"; "\n"))} | select(.normalizedBody | startswith($p + ": **RECOVERY_STATE_CAPTURED**")) | select(.normalizedBody | test("(^|\\n)-?[[:space:]]*Workflow run:[[:space:]]*" + $run + "[[:space:]]*($|\\n)")) | select(.normalizedBody | test("(^|\\n)-?[[:space:]]*Workflow attempt:[[:space:]]*" + $attempt + "[[:space:]]*($|\\n)"))] | sort_by(.created_at) | last // empty' <<<"$comments")"
              [ -n "$state_marker" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nExact post-create BO policy state receipt is absent; recovery refused to delete external state."; exit 1; }
              state_body="$(jq -r '.body | gsub("\\\\n"; "\n")' <<<"$state_marker")"
              policy_id="$(sed -nE 's/^Policy ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$state_body")"
              created_state_b64="$(sed -nE 's/^Created policy state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$state_body")"
              [ -n "$policy_id" ] && [ -n "$created_state_b64" ] || { echo "Malformed BO exact-state recovery receipt" >&2; exit 1; }
              created_state="$(printf '%s' "$created_state_b64" | base64 -d)"; jq -e . <<<"$created_state" >/dev/null
              mutation_payload="$(printf '%s' "$mutation_payload_b64" | base64 -d)"
              baseline_policies_state="$(printf '%s' "$baseline_policies_state_b64" | base64 -d)"
              jq -e . <<<"$mutation_payload" >/dev/null; jq -e . <<<"$baseline_policies_state" >/dev/null
              [ "$(jq -Sc '{name,decision,precedence,include,exclude:(.exclude // []),require:(.require // [])}' <<<"$created_state")" = "$(jq -Sc '.' <<<"$mutation_payload")" ] || { echo "BO mutation payload does not match captured created state" >&2; exit 1; }
              expected_post_policy_set_state="$(jq -Sc --argjson created "$created_state" '. + [$created] | sort_by(.id)' <<<"$baseline_policies_state")"
              api="https://api.cloudflare.com/client/v4"; auth=(-H "Authorization: Bearer ${CF_ACCESS_API_TOKEN}" -H 'Content-Type: application/json')
              fetch_policies() {
                local base_url="$1" page=1 total_pages=1 response all='[]'
                while [ "$page" -le "$total_pages" ]; do
                  response="$(curl -fsS "${base_url}?per_page=100&page=${page}" "${auth[@]}")" || return 1
                  jq -e '.success==true' <<<"$response" >/dev/null || return 1
                  all="$(jq -Sc --argjson prior "$all" '$prior + [.result[]?]' <<<"$response")"
                  total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$response")"
                  page=$((page+1))
                done
                jq -nc --argjson result "$all" '{success:true,result:$result}'
              }
              policies="$(fetch_policies "${api}/${base}/access/apps/${app_id}/policies")" || { echo "Cannot read complete BO policy set for recovery" >&2; exit 1; }
              current_policy_set_state="$(jq -Sc '[.result[]? | del(.created_at,.updated_at)] | sort_by(.id)' <<<"$policies")"
              current="$(jq -c --arg id "$policy_id" '.result[]? | select(.id==$id)' <<<"$policies" | head -1)"
              if [ -z "$current" ]; then
                [ "$current_policy_set_state" = "$baseline_policies_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nBO run-owned policy is absent but the full policy-set baseline is not restored."; exit 1; }
                result=BASELINE_ALREADY_ACTIVE
              else
                current_state="$(jq -Sc 'del(.created_at,.updated_at)' <<<"$current")"
                [ "$current_state" = "$created_state" ] && [ "$current_policy_set_state" = "$expected_post_policy_set_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nRun-owned BO policy or full policy-set state drifted after mutation; recovery refused to delete external state."; exit 1; }
                curl -fsS -X DELETE "${api}/${base}/access/apps/${app_id}/policies/${policy_id}" "${auth[@]}" >/dev/null
                restored_policies="$(fetch_policies "${api}/${base}/access/apps/${app_id}/policies")"
                [ "$(jq -Sc '[.result[]? | del(.created_at,.updated_at)] | sort_by(.id)' <<<"$restored_policies")" = "$baseline_policies_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nBO rollback DELETE completed but exact baseline policy-set restoration was not proven."; exit 1; }
                result=BASELINE_RESTORED
              fi
              ;;
            idp)
              app_id="$(sed -nE 's/^App ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              original_b64="$(sed -nE 's/^Original app payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_b64="$(sed -nE 's/^Desired app payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              original_state_b64="$(sed -nE 's/^Original app state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_state_b64="$(sed -nE 's/^Desired app state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              [ -n "$app_id" ] && [ -n "$original_b64" ] && [ -n "$desired_b64" ] && [ -n "$original_state_b64" ] && [ -n "$desired_state_b64" ] || { echo "Malformed IdP recovery marker" >&2; exit 1; }
              original="$(printf '%s' "$original_b64" | base64 -d)"; desired="$(printf '%s' "$desired_b64" | base64 -d)"
              original_state="$(printf '%s' "$original_state_b64" | base64 -d)"; desired_state="$(printf '%s' "$desired_state_b64" | base64 -d)"
              jq -e . <<<"$original" >/dev/null; jq -e . <<<"$desired" >/dev/null; jq -e . <<<"$original_state" >/dev/null; jq -e . <<<"$desired_state" >/dev/null
              [ "$(jq -Sc '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$original_state")" = "$(jq -Sc '.' <<<"$original")" ] || { echo "IdP rollback payload does not match captured baseline state" >&2; exit 1; }
              [ "$(jq -Sc '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$desired_state")" = "$(jq -Sc '.' <<<"$desired")" ] || { echo "IdP mutation payload does not match captured desired state" >&2; exit 1; }
              api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"; auth=(-H "Authorization: Bearer ${CF_ACCESS_API_TOKEN}" -H 'Content-Type: application/json')
              apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")"
              current="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$apps" | head -1)"
              [ -n "$current" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nTOS Access application is missing; recovery cannot prove exact run-owned state."; exit 1; }
              current_state="$(jq -Sc 'del(.created_at,.updated_at) | .allowed_idps=((.allowed_idps // []) | sort) | .policies=((.policies // []) | map(del(.created_at,.updated_at)) | sort_by(.id))' <<<"$current")"
              if [ "$current_state" = "$original_state" ]; then result=BASELINE_ALREADY_ACTIVE
              elif [ "$current_state" = "$desired_state" ]; then
                curl -fsS -X PUT "${api}/access/apps/${app_id}" "${auth[@]}" -d "$original" >/dev/null
                restored_apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")"
                restored_app="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$restored_apps" | head -1)"
                [ -n "$restored_app" ] && [ "$(jq -Sc 'del(.created_at,.updated_at) | .allowed_idps=((.allowed_idps // []) | sort) | .policies=((.policies // []) | map(del(.created_at,.updated_at)) | sort_by(.id))' <<<"$restored_app")" = "$original_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nTOS IdP rollback PUT completed but exact baseline restoration was not proven."; exit 1; }
                result=BASELINE_RESTORED
              else gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nTOS IdP live state no longer equals this run's desired state or baseline; recovery refused to overwrite external state."; exit 1
              fi
              ;;
            app)
              canonical_app_state() {
                jq -Sc 'del(.created_at,.updated_at) | .allowed_idps=((.allowed_idps // []) | sort) | .policies=((.policies // []) | map(del(.created_at,.updated_at)) | sort_by(.id)) | .self_hosted_domains=((.self_hosted_domains // []) | sort) | .destinations=((.destinations // []) | sort_by(.type,.uri))'
              }
              expected_rehomed_state() {
                local from="$1" to="$2"
                jq -Sc --arg from "$from" --arg to "$to" '.domain=$to | if (.name // "") == $from then .name=$to else . end | if (.self_hosted_domains // []) == [$from] then .self_hosted_domains=[$to] else . end | if (.destinations // []) == [{"type":"public","uri":$from}] then .destinations=[{"type":"public","uri":$to}] else . end'
              }
              app_id="$(sed -nE 's/^App ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              original_b64="$(sed -nE 's/^Original app payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_b64="$(sed -nE 's/^Desired app payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              original_state_b64="$(sed -nE 's/^Original app state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_state_b64="$(sed -nE 's/^Desired app state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              [ -n "$app_id" ] && [ -n "$original_b64" ] && [ -n "$desired_b64" ] && [ -n "$original_state_b64" ] && [ -n "$desired_state_b64" ] || { echo "Malformed Access-app recovery marker" >&2; exit 1; }
              original="$(printf '%s' "$original_b64" | base64 -d)"; desired="$(printf '%s' "$desired_b64" | base64 -d)"
              original_state="$(printf '%s' "$original_state_b64" | base64 -d)"; desired_state="$(printf '%s' "$desired_state_b64" | base64 -d)"
              jq -e . <<<"$original" >/dev/null; jq -e . <<<"$desired" >/dev/null; jq -e . <<<"$original_state" >/dev/null; jq -e . <<<"$desired_state" >/dev/null
              original_state="$(canonical_app_state <<<"$original_state")"; desired_state="$(canonical_app_state <<<"$desired_state")"
              [ "$(jq -Sc '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$original_state")" = "$(jq -Sc '.' <<<"$original")" ] || { echo "Access-app rollback payload does not match captured baseline state" >&2; exit 1; }
              [ "$(jq -Sc '{domain,type,allowed_idps:((.allowed_idps // []) | sort),auto_redirect_to_identity:(.auto_redirect_to_identity // false)}' <<<"$desired_state")" = "$(jq -Sc '.' <<<"$desired")" ] || { echo "Access-app mutation payload does not match captured desired state" >&2; exit 1; }
              original_domain="$(jq -r '.domain // empty' <<<"$original")"; desired_domain="$(jq -r '.domain // empty' <<<"$desired")"
              [ -n "$original_domain" ] && [ -n "$desired_domain" ] || { echo "Access-app recovery payload is missing domain identity" >&2; exit 1; }
              expected_desired_state="$(expected_rehomed_state "$original_domain" "$desired_domain" <<<"$original_state")"
              api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"; auth=(-H "Authorization: Bearer ${CF_ACCESS_API_TOKEN}" -H 'Content-Type: application/json')
              apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")"
              current="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$apps" | head -1)"
              [ -n "$current" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nAccess app is missing; recovery cannot prove exact run-owned state."; exit 1; }
              current_state="$(jq -Sc 'del(.created_at,.updated_at) | .allowed_idps=((.allowed_idps // []) | sort) | .policies=((.policies // []) | map(del(.created_at,.updated_at)) | sort_by(.id))' <<<"$current")"
              if [ "$current_state" = "$original_state" ]; then result=BASELINE_ALREADY_ACTIVE
              elif [ "$current_state" = "$desired_state" ]; then
                response="$(curl -sS -w '\n%{http_code}' -X PUT "${api}/access/apps/${app_id}" "${auth[@]}" -d "$original" || true)"
                code="${response##*$'\n'}"; response_body="${response%$'\n'*}"
                [ "$code" = "200" ] && jq -e '.success==true' <<<"$response_body" >/dev/null || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nAccess-app rollback PUT did not return a successful provider result."; exit 1; }
                restored_apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")"
                restored_app="$(jq -c --arg id "$app_id" '.result[]? | select(.id==$id)' <<<"$restored_apps" | head -1)"
                [ -n "$restored_app" ] && [ "$(canonical_app_state <<<"$restored_app")" = "$original_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nAccess-app rollback PUT completed but exact baseline restoration was not proven."; exit 1; }
                result=BASELINE_RESTORED
              else gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nAccess app live full state no longer equals this run's desired state or baseline; recovery refused to overwrite external state."; exit 1
              fi
              ;;
            eval)
              app_id="$(sed -nE 's/^App ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              policy_id="$(sed -nE 's/^Policy ID:[[:space:]]*([0-9a-f-]{36})[[:space:]]*$/\1/p' <<<"$body")"
              original_b64="$(sed -nE 's/^Original policy payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_b64="$(sed -nE 's/^Desired policy payload b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              original_state_b64="$(sed -nE 's/^Original policy state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              desired_state_b64="$(sed -nE 's/^Desired policy state b64:[[:space:]]*([A-Za-z0-9+\/=]+)[[:space:]]*$/\1/p' <<<"$body")"
              [ -n "$app_id" ] && [ -n "$policy_id" ] && [ -n "$original_b64" ] && [ -n "$desired_b64" ] && [ -n "$original_state_b64" ] && [ -n "$desired_state_b64" ] || { echo "Malformed evaluator-policy recovery marker" >&2; exit 1; }
              original="$(printf '%s' "$original_b64" | base64 -d)"; desired="$(printf '%s' "$desired_b64" | base64 -d)"
              original_state="$(printf '%s' "$original_state_b64" | base64 -d)"; desired_state="$(printf '%s' "$desired_state_b64" | base64 -d)"
              jq -e . <<<"$original" >/dev/null; jq -e . <<<"$desired" >/dev/null; jq -e . <<<"$original_state" >/dev/null; jq -e . <<<"$desired_state" >/dev/null
              [ "$(jq -Sc '{name,decision,precedence,include,exclude:(.exclude // []),require:(.require // [])}' <<<"$original_state")" = "$(jq -Sc '.' <<<"$original")" ] || { echo "Evaluator rollback payload does not match captured baseline state" >&2; exit 1; }
              [ "$(jq -Sc '{name,decision,precedence,include,exclude:(.exclude // []),require:(.require // [])}' <<<"$desired_state")" = "$(jq -Sc '.' <<<"$desired")" ] || { echo "Evaluator mutation payload does not match captured desired state" >&2; exit 1; }
              api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"; auth=(-H "Authorization: Bearer ${CF_ACCESS_API_TOKEN}" -H 'Content-Type: application/json')
              policies="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}")"
              current="$(jq -c --arg id "$policy_id" '.result[]? | select(.id==$id)' <<<"$policies" | head -1)"
              [ -n "$current" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nExternal-evaluation policy is missing; recovery cannot prove exact run-owned state."; exit 1; }
              current_state="$(jq -Sc 'del(.created_at,.updated_at)' <<<"$current")"
              if [ "$current_state" = "$original_state" ]; then result=BASELINE_ALREADY_ACTIVE
              elif [ "$current_state" = "$desired_state" ]; then
                curl -fsS -X PUT "${api}/access/apps/${app_id}/policies/${policy_id}" "${auth[@]}" -d "$original" >/dev/null
                restored_policies="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}")"
                restored_policy="$(jq -c --arg id "$policy_id" '.result[]? | select(.id==$id)' <<<"$restored_policies" | head -1)"
                [ -n "$restored_policy" ] && [ "$(jq -Sc 'del(.created_at,.updated_at)' <<<"$restored_policy")" = "$original_state" ] || { gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nExternal-evaluation rollback PUT completed but exact baseline restoration was not proven."; exit 1; }
                result=BASELINE_RESTORED
              else gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_HOLD**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nExternal-evaluation policy no longer equals this run's desired state or baseline; recovery refused to overwrite external state."; exit 1
              fi
              ;;
          esac
          gh issue comment "$issue" --repo "$repo" --body "${prefix}: **WATCHDOG_RECOVERED**\n\nWorkflow run: ${run_id}\nWorkflow attempt: ${recovery_attempt}\nRecovery result: ${result}.\nOnly the exact run-owned pre-mutation baseline was reconciled."
