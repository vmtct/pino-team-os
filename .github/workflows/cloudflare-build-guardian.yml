name: Cloudflare Build + Serving Truth

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to inspect (leave blank for latest main)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: cloudflare-serving-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WORKER_NAME: pino-team-os
      COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout inspected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 2

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CF_ACCOUNT_ID CF_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "Missing GitHub Actions secret: $name" >&2; exit 1; }
          done

      - name: Classify source delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files="$(git diff --name-only '${{ github.event.before }}' "$COMMIT_SHA" || true)"
          else
            files="$(git diff-tree --no-commit-id --name-only -r "$COMMIT_SHA" || true)"
          fi
          printf '%s\n' "$files"
          runtime_files="$(printf '%s\n' "$files" | grep -Ev '^(\.github/|docs/|.*\.md$)' || true)"
          if [ -n "$runtime_files" ]; then
            echo "runtime_affecting=true" >> "$GITHUB_OUTPUT"
            printf 'Runtime-affecting files:\n%s\n' "$runtime_files"
          else
            echo "runtime_affecting=false" >> "$GITHUB_OUTPUT"
            echo "Control-plane/docs-only commit; serving runtime is not expected to match this SHA."
          fi

      - name: Collect Cloudflare build and serving truth
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")

          scripts="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts" "${auth[@]}")"
          worker_tag="$(jq -r --arg n "$WORKER_NAME" '.result[]? | select(.id==$n) | .tag // empty' <<<"$scripts" | head -1)"
          [ -n "$worker_tag" ] || { echo "Cannot resolve Worker tag" >&2; exit 1; }

          builds_url="${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${worker_tag}/builds?per_page=100"
          build_json=""; build_outcome=""
          echo "Waiting for Cloudflare build for ${COMMIT_SHA}..."
          for attempt in $(seq 1 18); do
            builds="$(curl -fsS "$builds_url" "${auth[@]}")"
            build_json="$(jq -c --arg sha "$COMMIT_SHA" '.result[]? | select((.build_trigger_metadata.commit_hash // "") == $sha) | {build_uuid,build_outcome:(.build_outcome // ""),branch:(.build_trigger_metadata.branch // ""),created_on:(.created_on // ""),commit_message:(.build_trigger_metadata.commit_message // "")}' <<<"$builds" | head -1)"
            if [ -n "$build_json" ]; then
              build_outcome="$(jq -r '.build_outcome' <<<"$build_json")"
              echo "Build $(jq -r '.build_uuid' <<<"$build_json"): ${build_outcome:-running}"
              case "$build_outcome" in success|fail|skipped|cancelled|terminated) break;; esac
            fi
            [ "$attempt" -eq 18 ] || sleep 20
          done

          if [ -z "$build_json" ]; then
            build_uuid=""; build_outcome="not_found"; branch=""; created_on=""; commit_message=""
          else
            build_uuid="$(jq -r '.build_uuid' <<<"$build_json")"
            branch="$(jq -r '.branch' <<<"$build_json")"
            created_on="$(jq -r '.created_on' <<<"$build_json")"
            commit_message="$(jq -r '.commit_message' <<<"$build_json")"
            [ -n "$build_outcome" ] || build_outcome="timeout"
          fi

          active_version=""; active_commit=""; serving="false"
          if [ "$build_outcome" = "success" ]; then
            deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" "${auth[@]}")"
            active_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployments" | head -1)"
            if [ -n "$active_version" ]; then
              provenance="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/builds?version_ids=${active_version}" "${auth[@]}")"
              active_commit="$(jq -r '.result.builds | to_entries[]? | .value.build_trigger_metadata.commit_hash // empty' <<<"$provenance" | head -1)"
            fi
            [ "$active_commit" = "$COMMIT_SHA" ] && serving="true"
          fi

          runtime_affecting='${{ steps.delta.outputs.runtime_affecting }}'
          status="$build_outcome"
          if [ "$build_outcome" = "success" ] && [ "$runtime_affecting" = "true" ] && [ "$serving" != "true" ]; then
            status="built_not_deployed"
          elif [ "$build_outcome" = "success" ] && [ "$runtime_affecting" != "true" ]; then
            status="control_plane_only"
          fi

          cat > cloudflare-status.md <<EOF
          # PINO Team OS — Cloudflare Build + Serving Truth

          - Worker: \`${WORKER_NAME}\`
          - Inspected commit: \`${COMMIT_SHA}\`
          - Runtime-affecting: **${runtime_affecting}**
          - Build UUID: \`${build_uuid:-n/a}\`
          - Build outcome: **${build_outcome}**
          - Active 100% version: \`${active_version:-n/a}\`
          - Active source commit: \`${active_commit:-unknown}\`
          - Exact inspected commit serving 100%: **${serving}**
          - Status: **${status}**
          - Branch: \`${branch:-n/a}\`
          - Created: \`${created_on:-n/a}\`
          - Commit message: ${commit_message:-n/a}

          Build success is not production authorization and is not proof of serving traffic.
          EOF
          cat cloudflare-status.md
          {
            echo "build_uuid=${build_uuid}"
            echo "build_outcome=${build_outcome}"
            echo "active_version=${active_version}"
            echo "active_commit=${active_commit}"
            echo "serving=${serving}"
            echo "status=${status}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-serving-${{ steps.cf.outputs.build_uuid || github.run_id }}
          path: cloudflare-status.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        run: cat cloudflare-status.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Trigger production smoke only for exact serving runtime
        if: steps.delta.outputs.runtime_affecting == 'true' && steps.cf.outputs.build_outcome == 'success' && steps.cf.outputs.serving == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact runtime ${COMMIT_SHA} is active at 100%; triggering production smoke."
          gh workflow run e2e-production-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail on Cloudflare build failure
        if: steps.cf.outputs.build_outcome == 'fail' || steps.cf.outputs.build_outcome == 'not_found' || steps.cf.outputs.build_outcome == 'timeout' || steps.cf.outputs.build_outcome == 'cancelled' || steps.cf.outputs.build_outcome == 'terminated'
        shell: bash
        run: |
          echo "Cloudflare build outcome: ${{ steps.cf.outputs.build_outcome }}" >&2
          exit 1

      - name: Fail runtime commit that is built but not serving
        if: steps.delta.outputs.runtime_affecting == 'true' && steps.cf.outputs.build_outcome == 'success' && steps.cf.outputs.serving != 'true'
        shell: bash
        run: |
          echo "Runtime commit built successfully but is NOT the active 100% Worker version." >&2
          echo "A separately approved production promotion is required. Production smoke was intentionally not run." >&2
          exit 1
