name: Cloudflare Status Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to inspect (leave blank for the latest main commit)"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: cloudflare-status-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WORKER_NAME: pino-team-os
      COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CF_ACCOUNT_ID CF_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Collect Cloudflare build status and logs
        id: cf
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4"
          auth=( -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" )

          worker_json="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts" "${auth[@]}")"
          worker_tag="$(jq -r --arg name "$WORKER_NAME" '.result[]? | select(.id == $name) | .tag // empty' <<<"$worker_json" | head -n 1)"

          if [ -z "$worker_tag" ]; then
            echo "Could not resolve Cloudflare Worker tag." >&2
            jq '{success,errors,messages}' <<<"$worker_json" >&2
            exit 1
          fi

          builds_url="${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${worker_tag}/builds?per_page=100"
          build_json=""
          outcome=""

          echo "Waiting for Cloudflare build for commit ${COMMIT_SHA}..."
          for attempt in $(seq 1 18); do
            builds_json="$(curl -fsS "$builds_url" "${auth[@]}")"
            build_json="$(jq -c --arg sha "$COMMIT_SHA" '
              .result[]?
              | select((.build_trigger_metadata.commit_hash // "") == $sha)
              | {
                  build_uuid,
                  build_outcome: (.build_outcome // ""),
                  branch: (.build_trigger_metadata.branch // ""),
                  created_on: (.created_on // ""),
                  commit_message: (.build_trigger_metadata.commit_message // "")
                }
            ' <<<"$builds_json" | head -n 1)"

            if [ -n "$build_json" ]; then
              outcome="$(jq -r '.build_outcome' <<<"$build_json")"
              echo "Cloudflare build found: $(jq -r '.build_uuid' <<<"$build_json") (outcome=${outcome:-running})"

              case "$outcome" in
                success|fail|skipped|cancelled|terminated)
                  break
                  ;;
              esac
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 20
            fi
          done

          if [ -z "$build_json" ]; then
            outcome="not_found"
            build_uuid=""
            branch=""
            created_on=""
            commit_message=""
            echo "No Cloudflare Workers Build found for commit ${COMMIT_SHA} after waiting." >&2
          else
            build_uuid="$(jq -r '.build_uuid' <<<"$build_json")"
            outcome="$(jq -r '.build_outcome' <<<"$build_json")"
            branch="$(jq -r '.branch' <<<"$build_json")"
            created_on="$(jq -r '.created_on' <<<"$build_json")"
            commit_message="$(jq -r '.commit_message' <<<"$build_json")"

            if [ -z "$outcome" ]; then
              outcome="timeout"
              echo "Cloudflare build still has no terminal outcome after waiting." >&2
            fi

            logs_url="${api}/accounts/${CF_ACCOUNT_ID}/builds/builds/${build_uuid}/logs"
            : > cloudflare-build-response.json
            : > cloudflare-build.log
            cursor=""
            first_page="true"

            for page in $(seq 1 20); do
              if [ -n "$cursor" ]; then
                response="$(curl -fsS "${logs_url}?cursor=$(printf '%s' "$cursor" | jq -sRr @uri)" "${auth[@]}")"
              else
                response="$(curl -fsS "$logs_url" "${auth[@]}")"
              fi

              if [ "$first_page" = "true" ]; then
                printf '%s' "$response" > cloudflare-build-response.json
                first_page="false"
              fi

              jq -r '.result.lines[]? | if type == "array" then .[1] else . end' <<<"$response" >> cloudflare-build.log || true
              cursor="$(jq -r '.result.cursor // empty' <<<"$response")"
              [ -z "$cursor" ] && break
            done

            if [ ! -s cloudflare-build.log ]; then
              jq -r '.errors[]?.message, .messages[]?' cloudflare-build-response.json > cloudflare-build.log || true
            fi
          fi

          cat > cloudflare-status.md <<EOF
          # PINO Team OS — Cloudflare Status

          - Worker: \`${WORKER_NAME}\`
          - Commit: \`${COMMIT_SHA}\`
          - Build UUID: \`${build_uuid:-n/a}\`
          - Outcome: **${outcome}**
          - Branch: \`${branch:-n/a}\`
          - Created: \`${created_on:-n/a}\`
          - Commit message: ${commit_message:-n/a}

          This diagnostic was collected automatically by GitHub Actions.
          EOF

          if [ ! -s cloudflare-build-response.json ]; then
            printf '{"success":false,"errors":[{"message":"Cloudflare build not found for commit %s"}]}' "$COMMIT_SHA" > cloudflare-build-response.json
            printf 'Cloudflare build not found for commit %s\n' "$COMMIT_SHA" > cloudflare-build.log
          fi

          cat cloudflare-status.md
          {
            echo "build_uuid=${build_uuid}"
            echo "outcome=${outcome}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Cloudflare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-status-${{ steps.cf.outputs.build_uuid || github.run_id }}
          path: |
            cloudflare-status.md
            cloudflare-build.log
            cloudflare-build-response.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f cloudflare-status.md ]; then
            cat cloudflare-status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger production smoke after successful Cloudflare build
        if: steps.cf.outputs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloudflare build succeeded for ${COMMIT_SHA}; triggering production smoke."
          gh workflow run e2e-production-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Open GitHub incident when Cloudflare fails
        if: steps.cf.outputs.outcome == 'fail' || steps.cf.outputs.outcome == 'not_found' || steps.cf.outputs.outcome == 'timeout' || steps.cf.outputs.outcome == 'cancelled' || steps.cf.outputs.outcome == 'terminated'
        shell: bash
        run: |
          set -euo pipefail

          title="Cloudflare build failure: ${COMMIT_SHA:0:12}"
          body_file="cloudflare-incident.md"
          {
            echo "## Cloudflare build failure"
            echo
            cat cloudflare-status.md
            echo
            echo "### Diagnostic log"
            echo '```text'
            tail -n 500 cloudflare-build.log || true
            echo '```'
            echo
            echo "### GitHub run"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This issue was created automatically. Review the Cloudflare log and the referenced commit before making a fix."
          } > "$body_file"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file "$body_file"

      - name: Fail workflow when Cloudflare build failed
        if: steps.cf.outputs.outcome == 'fail' || steps.cf.outputs.outcome == 'not_found' || steps.cf.outputs.outcome == 'timeout' || steps.cf.outputs.outcome == 'cancelled' || steps.cf.outputs.outcome == 'terminated'
        shell: bash
        run: |
          echo "Cloudflare outcome: ${{ steps.cf.outputs.outcome }}"
          exit 1
