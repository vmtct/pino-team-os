name: A-D Team Production Release

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: pino-team-os-production
  cancel-in-progress: false

jobs:
  release:
    if: github.event.issue.title == '[GPT] A-D Team production release' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TEAM_WORKER: pino-team-os
      CORE_WORKER: pino-core
      TARGET_TEAM_SHA: 112041ee411db908161dd60ecf04d072626fd9f9
      TARGET_TEAM_VERSION: d3825ac1-f7d9-404b-883b-99d5e89f4f2d
      TARGET_CORE_SHA: fa12eb40e2ae967463427f17b99882022a580b7e
      TOS_HOST: tos.pinohouse.art
      BO_HOST: bo.pinohouse.art
      ZONE_ID: 48b2809afabf3d65d30f80f346126213

    steps:
      - name: Validate Founder A-D Team release request
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          reject() {
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "A_D_TEAM_PRODUCTION_RELEASE: **REJECTED**\n\n$1\n\nNo production mutation was attempted."
            exit 1
          }
          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one TEAM_SHA line."
          requested="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          [ "$requested" = "$TARGET_TEAM_SHA" ] || reject "Requested Team SHA is not the reviewed A-D candidate."
          grep -Eq '^CONFIRM:[[:space:]]*RELEASE_A_D_TEAM_PRODUCTION[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing CONFIRM: RELEASE_A_D_TEAM_PRODUCTION."
          [ -n "${CF_ACCOUNT_ID:-}" ] || reject "CF_ACCOUNT_ID unavailable."
          [ -n "${CF_API_TOKEN:-}" ] || reject "CF_API_TOKEN unavailable."

          main_sha="$(git ls-remote "https://github.com/${repo}.git" refs/heads/main | awk '{print $1}')" || reject "Cannot resolve Team main."
          [ -n "$main_sha" ] || reject "Cannot resolve Team main."
          compare="$(gh api "/repos/${repo}/compare/${TARGET_TEAM_SHA}...${main_sha}")" || reject "Cannot compare target Team source with current main."
          status="$(jq -r '.status' <<<"$compare")"
          [ "$status" = "identical" ] || [ "$status" = "ahead" ] || reject "Target Team source is not an ancestor of current main."
          unexpected="$(jq -r '.files[]?.filename' <<<"$compare" | grep -Ev '^(\.github/|docs/|.*\.md$)' || true)"
          [ -z "$unexpected" ] || reject "Runtime-affecting Team drift exists after the reviewed target: ${unexpected//$'\n'/, }."

      - name: Check out current Team control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Team candidate and Core-first dependency
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          repo="$GITHUB_REPOSITORY"
          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "A_D_TEAM_PRODUCTION_RELEASE: **FAIL_SAFE**\n\n$1\n\nNo Team production traffic was changed."
            exit 1
          }

          target="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/versions/${TARGET_TEAM_VERSION}" "${auth[@]}")" || fail "Target Team version does not exist."
          jq -e '.success==true' <<<"$target" >/dev/null || fail "Cloudflare did not return target Team version successfully."
          for binding in PINO_WORKFORCE_CORE PINO_STAFF_PIN_CORE PINO_PINORIA_TV_CORE PINO_TOS_LEARNING_CORE; do
            jq -e --arg b "$binding" '[.result.resources.bindings[]?.name] | index($b) != null' <<<"$target" >/dev/null || fail "Target Team version lost required private binding: ${binding}."
          done

          provenance="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/builds?version_ids=${TARGET_TEAM_VERSION}" "${auth[@]}")" || fail "Cannot inspect Team candidate build provenance."
          candidate_commit="$(jq -r '.result.builds | to_entries[]? | .value.build_trigger_metadata.commit_hash // empty' <<<"$provenance" | head -1)"
          [ "$candidate_commit" = "$TARGET_TEAM_SHA" ] || fail "Team candidate provenance is ${candidate_commit:-unknown}, expected ${TARGET_TEAM_SHA}."

          core_deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/deployments" "${auth[@]}")" || fail "Cannot inspect Core deployment."
          core_active="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$core_deployments" | head -1)"
          [ -n "$core_active" ] || fail "Cannot resolve one active 100% Core version."
          core_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/versions/${core_active}" "${auth[@]}")" || fail "Cannot inspect active Core version."
          core_message="$(jq -r '.result.annotations["workers/message"] // empty' <<<"$core_detail")"
          [ "$core_message" = "A-D Core production ${TARGET_CORE_SHA}" ] || fail "Core-first dependency is not proven. Active Core is not the governed A-D release for ${TARGET_CORE_SHA}."
          for binding in DB STAFF_PIN_PEPPER; do
            jq -e --arg b "$binding" '[.result.resources.bindings[]?.name] | index($b) != null' <<<"$core_detail" >/dev/null || fail "Active A-D Core lacks required binding: ${binding}."
          done

          deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/deployments" "${auth[@]}")" || fail "Cannot inspect current Team deployment."
          old_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$deployments" | head -1)"
          [ -n "$old_version" ] || fail "Cannot resolve current 100% Team version."
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "core_active=$core_active" >> "$GITHUB_OUTPUT"

          domains="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/domains" "${auth[@]}")" || fail "Cannot inspect Worker domains."
          jq -e --arg h "$TOS_HOST" --arg s "$TEAM_WORKER" '[.result[]? | select(.hostname==$h and .service==$s)] | length==1' <<<"$domains" >/dev/null || fail "TOS is not attached exactly once to Team OS."
          jq -e --arg h "$BO_HOST" '[.result[]? | select(.hostname==$h)] | length==0' <<<"$domains" >/dev/null || fail "BO is unexpectedly attached."
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.service==$s)] | length==0' <<<"$domains" >/dev/null || fail "Core unexpectedly owns a custom domain."
          routes="$(curl -fsS "${api}/zones/${ZONE_ID}/workers/routes" "${auth[@]}")" || fail "Cannot inspect zone routes."
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.script==$s)] | length==0' <<<"$routes" >/dev/null || fail "Core has a public zone route."
          jq -e --arg h "$BO_HOST" '[.result[]? | select((.pattern // "") | contains($h))] | length==0' <<<"$routes" >/dev/null || fail "BO has a public zone route."

      - name: Promote exact A-D Team runtime
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          repo="$GITHUB_REPOSITORY"
          old_version="${{ steps.preflight.outputs.old_version }}"
          serving_changed=0
          rollback() {
            if [ "$serving_changed" -eq 1 ] && [ -n "$old_version" ]; then
              CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@4.126.0 versions deploy "${old_version}@100%" -y >/dev/null 2>&1 || true
            fi
          }
          fail() {
            rollback
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "A_D_TEAM_PRODUCTION_RELEASE: **FAIL_SAFE**\n\n$1\n\nPrevious Team runtime rollback was attempted if traffic changed. Core, D1, Access policy, routes, and domains were not mutated by this operator."
            exit 1
          }

          if [ "$old_version" != "$TARGET_TEAM_VERSION" ]; then
            CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx --yes wrangler@4.126.0 versions deploy "${TARGET_TEAM_VERSION}@100%" -y >/dev/null || fail "Could not promote exact A-D Team version."
            serving_changed=1
          fi
          current="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/deployments" "${auth[@]}")" || fail "Cannot verify post-promotion Team traffic."
          active="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$current" | head -1)"
          [ "$active" = "$TARGET_TEAM_VERSION" ] || fail "Exact A-D Team version is not active at 100%."

          domains="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/domains" "${auth[@]}")" || fail "Cannot verify post-promotion domains."
          jq -e --arg h "$TOS_HOST" --arg s "$TEAM_WORKER" '[.result[]? | select(.hostname==$h and .service==$s)] | length==1' <<<"$domains" >/dev/null || fail "TOS attachment changed unexpectedly."
          jq -e --arg h "$BO_HOST" '[.result[]? | select(.hostname==$h)] | length==0' <<<"$domains" >/dev/null || fail "BO became attached unexpectedly."
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.service==$s)] | length==0' <<<"$domains" >/dev/null || fail "Core gained a custom domain."

          for path in / /pinoria /pinoria-tv; do
            headers="$RUNNER_TEMP/headers.txt"
            : > "$headers"
            code="$(curl -sS --max-time 12 -D "$headers" -o /dev/null -w '%{http_code}' "https://${TOS_HOST}${path}" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
            challenge="$(awk 'BEGIN{IGNORECASE=1} /^www-authenticate:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
            case "$code" in
              302|303|307) [[ "$location" =~ cloudflareaccess\.com ]] || fail "${path} redirects outside Cloudflare Access." ;;
              401|403) [[ "$challenge" == *Cloudflare-Access* || -n "$challenge" ]] || fail "${path} denied without a recognizable Access challenge." ;;
              200) fail "${path} became publicly reachable without Cloudflare Access." ;;
              *) fail "${path} perimeter smoke returned unexpected HTTP ${code}." ;;
            esac
          done

          serving_changed=0
          gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "A_D_TEAM_PRODUCTION_RELEASE: **PASS**\n\n- Team source: ${TARGET_TEAM_SHA}\n- Team Worker version: ${TARGET_TEAM_VERSION} at 100%\n- Core source dependency: ${TARGET_CORE_SHA}\n- Core active version: ${{ steps.preflight.outputs.core_active }}\n- TOS: attached and Cloudflare Access protected\n- BO: detached\n- Core public ingress: none\n\nNo D1, Core runtime, Access-policy, route, custom-domain, Staff, learner, Visit, Attendance, or character data mutation was performed by this Team operator."
