name: Arrival v0 Core Build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  core-build:
    if: github.event.issue.title == '[GPT] Arrival v0 core build' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CORE_WORKER: pino-core
      CORE_SHA: e7f8c903ab39a402b5c5a44fe9160c554d7a837d
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Reject retired cross-repo Core production mutator
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ARRIVAL_V0_CORE_BUILD: **REJECTED**\n\nThis cross-repository Core production promoter is retired. Core production mutation must run through a Core-owned PLT-RELEASE operator so it participates in the canonical `pino-core-production` lock.\n\nNo Cloudflare mutation was attempted."
          exit 1

      - name: Trigger exact Core production build
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          repo="${GITHUB_REPOSITORY}"
          ephemeral_trigger_uuid=""

          cleanup() {
            if [ -n "${ephemeral_trigger_uuid:-}" ]; then
              curl -fsS -X DELETE "${api}/accounts/${CF_ACCOUNT_ID}/builds/triggers/${ephemeral_trigger_uuid}" "${auth[@]}" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "ARRIVAL_V0_CORE_BUILD: **FAIL_SAFE**\n\n$1\n\nNo ingress/domain mutation was performed. Any ephemeral build trigger is cleanup-only and cannot auto-match main."
            exit 1
          }

          [ -n "${CF_ACCOUNT_ID:-}" ] || fail "Missing CF_ACCOUNT_ID."
          [ -n "${CF_API_TOKEN:-}" ] || fail "Missing CF_API_TOKEN."

          scripts="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts" "${auth[@]}")" || fail "Cannot list Workers scripts."
          core_tag="$(jq -r --arg n "$CORE_WORKER" '.result[]? | select(.id==$n) | .tag // empty' <<<"$scripts" | head -1)"
          [ -n "$core_tag" ] || fail "Cannot resolve pino-core Worker tag."

          builds="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${core_tag}/builds?per_page=100" "${auth[@]}")" || fail "Cannot list pino-core builds."
          build_uuid="$(jq -r --arg sha "$CORE_SHA" '.result[]? | select((.build_trigger_metadata.commit_hash // "") == $sha) | .build_uuid // empty' <<<"$builds" | head -1)"

          if [ -z "$build_uuid" ]; then
            triggers="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/workers/${core_tag}/triggers" "${auth[@]}")" || fail "Cannot list pino-core build triggers."
            trigger_uuid="$(jq -r '.result[]? | select((.deleted_on // null) == null) | select((.branch_includes // []) | index("main")) | .trigger_uuid // empty' <<<"$triggers" | head -1)"

            if [ -z "$trigger_uuid" ]; then
              # No persistent production trigger exists. Reuse only repository/build-token metadata
              # from one active trigger, but create a temporary non-auto-matching trigger whose
              # deploy command is pinned to the canonical production Wrangler environment.
              source_count="$(jq '[.result[]? | select((.deleted_on // null) == null) | select((.repo_connection.repo_name // "") == "pino-core")] | length' <<<"$triggers")"
              [ "$source_count" = "1" ] || fail "Expected exactly one active pino-core repository trigger to source connection metadata; found ${source_count}."

              source="$(jq -c '.result[]? | select((.deleted_on // null) == null) | select((.repo_connection.repo_name // "") == "pino-core")' <<<"$triggers" | head -1)"
              build_token_uuid="$(jq -r '.build_token_uuid // empty' <<<"$source")"
              repo_connection_uuid="$(jq -r '.repo_connection.repo_connection_uuid // empty' <<<"$source")"
              build_command="$(jq -r '.build_command // ""' <<<"$source")"
              root_directory="$(jq -r '.root_directory // "/"' <<<"$source")"
              path_includes="$(jq -c '.path_includes // ["*"]' <<<"$source")"
              path_excludes="$(jq -c '.path_excludes // []' <<<"$source")"
              [ -n "$build_token_uuid" ] || fail "Existing pino-core repository trigger has no reusable build token UUID."
              [ -n "$repo_connection_uuid" ] || fail "Existing pino-core repository trigger has no reusable repository connection UUID."

              trigger_payload="$(jq -n \
                --arg build_command "$build_command" \
                --arg build_token_uuid "$build_token_uuid" \
                --arg external_script_id "$core_tag" \
                --arg repo_connection_uuid "$repo_connection_uuid" \
                --arg root_directory "$root_directory" \
                --argjson path_includes "$path_includes" \
                --argjson path_excludes "$path_excludes" \
                '{
                  branch_excludes: [],
                  branch_includes: ["__arrival_v0_manual_only__"],
                  build_command: $build_command,
                  build_token_uuid: $build_token_uuid,
                  deploy_command: "npx wrangler deploy --env production",
                  external_script_id: $external_script_id,
                  path_excludes: $path_excludes,
                  path_includes: $path_includes,
                  repo_connection_uuid: $repo_connection_uuid,
                  root_directory: $root_directory,
                  trigger_name: "Arrival v0 ephemeral exact production deploy"
                }')"

              create_file="$(mktemp)"
              create_code="$(curl -sS -o "$create_file" -w '%{http_code}' -X POST "${api}/accounts/${CF_ACCOUNT_ID}/builds/triggers" "${auth[@]}" --data "$trigger_payload")" || fail "Cloudflare ephemeral trigger request failed."
              if [ "$create_code" -lt 200 ] || [ "$create_code" -ge 300 ]; then
                message="$(jq -r '[.errors[]?.message] | join("; ")' "$create_file" 2>/dev/null || true)"
                fail "Cloudflare rejected ephemeral production trigger creation (HTTP ${create_code}${message:+: ${message}})."
              fi
              ephemeral_trigger_uuid="$(jq -r '.result.trigger_uuid // empty' "$create_file")"
              [ -n "$ephemeral_trigger_uuid" ] || fail "Cloudflare returned no ephemeral trigger UUID."
              trigger_uuid="$ephemeral_trigger_uuid"
            fi

            response_file="$(mktemp)"
            http_code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST "${api}/accounts/${CF_ACCOUNT_ID}/builds/triggers/${trigger_uuid}/builds" "${auth[@]}" --data "{\"branch\":\"main\",\"commit_hash\":\"${CORE_SHA}\"}")" || fail "Cloudflare exact build request failed."
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              message="$(jq -r '[.errors[]?.message] | join("; ")' "$response_file" 2>/dev/null || true)"
              fail "Cloudflare rejected the exact Core build (HTTP ${http_code}${message:+: ${message}})."
            fi
            build_uuid="$(jq -r '.result.build_uuid // empty' "$response_file")"
            [ -n "$build_uuid" ] || fail "Cloudflare accepted the request but returned no build UUID."
          fi

          for _ in $(seq 1 60); do
            build="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/builds/${build_uuid}" "${auth[@]}")" || fail "Cannot inspect Core build ${build_uuid}."
            status="$(jq -r '.result.status // empty' <<<"$build")"
            outcome="$(jq -r '.result.build_outcome // empty' <<<"$build")"
            commit="$(jq -r '.result.build_trigger_metadata.commit_hash // empty' <<<"$build")"
            [ "$commit" = "$CORE_SHA" ] || fail "Build UUID resolved to unexpected commit ${commit:-unknown}."
            if [ "$status" = "stopped" ]; then
              [ "$outcome" = "success" ] || fail "Exact Core build stopped with outcome: ${outcome:-unknown}."
              break
            fi
            sleep 10
          done

          build="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/builds/${build_uuid}" "${auth[@]}")" || fail "Cannot re-read terminal Core build."
          [ "$(jq -r '.result.status // empty' <<<"$build")" = "stopped" ] || fail "Exact Core build did not reach a terminal state inside the bounded check window."
          [ "$(jq -r '.result.build_outcome // empty' <<<"$build")" = "success" ] || fail "Exact Core build is not successful."

          # Successful build is not enough: prove exact source is the active 100% Worker deployment.
          for _ in $(seq 1 30); do
            deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/deployments" "${auth[@]}")" || fail "Cannot inspect post-build pino-core deployment."
            active_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployments" | head -1)"
            if [ -n "$active_version" ]; then
              active_build="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/builds/builds?version_ids=${active_version}" "${auth[@]}")" || fail "Cannot map active pino-core version to build provenance."
              active_commit="$(jq -r '.result.builds | to_entries[]? | .value.build_trigger_metadata.commit_hash // empty' <<<"$active_build" | head -1)"
              if [ "$active_commit" = "$CORE_SHA" ]; then
                cleanup
                ephemeral_trigger_uuid=""
                gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "ARRIVAL_V0_CORE_BUILD: **PASS**\n\n- Core SHA: ${CORE_SHA}\n- Cloudflare build: ${build_uuid}\n- Active Worker version: ${active_version}\n- Traffic: 100%\n- Ephemeral trigger: removed\n- Outcome: success\n\nNo ingress/domain mutation was performed."
                exit 0
              fi
            fi
            sleep 5
          done

          fail "Exact Core build succeeded but the resulting commit is not verified as the active 100% pino-core deployment."
