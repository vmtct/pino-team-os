name: GPT Command Bridge

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  command:
    if: startsWith(github.event.issue.title, '[GPT]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Accept GPT command
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "GPT command received. Starting Cloudflare status diagnostics for the current main commit."

      - name: Start Cloudflare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          run_url="$(gh workflow run cloudflare-build-guardian.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1 | tail -n 1 || true)"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Cloudflare diagnostics triggered. $run_url"
