name: Workforce Team staging deploy

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: workforce-team-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.issue.title == '[GPT] Workforce Team staging deploy' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
      STAGING_URL: https://pino-team-os-staging.minhtri-van42.workers.dev

    steps:
      - name: Validate reviewed Workforce staging request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          reject() {
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WORKFORCE_TEAM_STAGING_DEPLOY: REJECTED

          $1

          No staging or production deploy was attempted."
            exit 1
          }
          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          mapfile -t pr_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^SOURCE_PR:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one TEAM_SHA line."
          [ "${#pr_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one SOURCE_PR line."
          team_sha="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          source_pr="${pr_lines[0]}"
          grep -Eq '^CONFIRM:[[:space:]]*DEPLOY_WORKFORCE_TEAM_STAGING[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing explicit staging deploy confirmation."

          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$team_sha" = "$main_sha" ] || reject "Requested SHA is not current Team main."
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${source_pr}")"
          [ "$(jq -r '.base.ref' <<<"$pr")" = "main" ] || reject "Source PR does not target main."
          [ "$(jq -r '.merged_at // empty' <<<"$pr")" != "" ] || reject "Source PR is not merged."
          [ "$(jq -r '.merge_commit_sha // empty' <<<"$pr")" = "$team_sha" ] || reject "Source PR merge SHA does not equal requested Team SHA."
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          [ -n "$head_sha" ] || reject "Cannot resolve source PR head SHA."

          pr_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&status=completed&per_page=30")"
          jq -e '[.workflow_runs[] | select(.name == "PR Validation" and .conclusion == "success")] | length >= 1' <<<"$pr_runs" >/dev/null || reject "No successful PR Validation exists for source PR head."
          main_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${team_sha}&event=push&status=completed&per_page=30")"
          jq -e '[.workflow_runs[] | select(.name == "Cloudflare Build + Serving Truth" and .conclusion == "success")] | length >= 1' <<<"$main_runs" >/dev/null || reject "Exact Team main has no successful build/serving-truth run."

          echo "team_sha=$team_sha" >> "$GITHUB_OUTPUT"
          echo "source_pr=$source_pr" >> "$GITHUB_OUTPUT"
          echo "TEAM_SHA=$team_sha" >> "$GITHUB_ENV"

      - name: Check out exact merged Team SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.team_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Re-run exact source validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEAM_SHA"
          test -z "$(git status --porcelain)"
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build OpenNext staging artifact
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js

      - name: Assert Workforce staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const staging = JSON.parse(fs.readFileSync('wrangler.staging.jsonc', 'utf8'));
          const production = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (staging.name !== 'pino-team-os-staging' || staging.workers_dev !== true) throw new Error('wrong Team staging Worker boundary');
          if (staging.vars?.WORKFORCE_BO_STAGING_BYPASS !== 'enabled') throw new Error('Workforce BO staging bypass disabled');
          if (staging.vars?.WORKFORCE_STAGING_BO_EMAIL !== 'workforce-planning-staging-probe@pino.invalid') throw new Error('Workforce BO staging identity drift');
          if (staging.vars?.PINORIA_TOS_STAGING_BYPASS !== 'enabled') throw new Error('TOS staging identity bypass disabled');
          const required = new Set(['PINO_CORE', 'PINO_WORKFORCE_CORE', 'PINO_BO_CORE', 'PINO_TOS_LEARNING_CORE', 'PINO_STAFF_PIN_CORE']);
          for (const service of staging.services ?? []) {
            if (service.service !== 'pino-core-staging') throw new Error(`non-staging Core binding: ${service.binding}`);
            required.delete(service.binding);
          }
          if (required.size) throw new Error(`missing staging Core bindings: ${[...required].join(',')}`);
          for (const service of production.services ?? []) if (service.service !== 'pino-core') throw new Error(`production Core binding drift: ${service.binding}`);
          const productionRaw = fs.readFileSync('wrangler.jsonc', 'utf8');
          for (const name of ['WORKFORCE_BO_STAGING_BYPASS', 'WORKFORCE_STAGING_BO_EMAIL', 'PINORIA_TOS_STAGING_BYPASS', 'PINORIA_STAGING_STAFF_EMAIL']) {
            if (productionRaw.includes(name)) throw new Error(`staging variable leaked into production config: ${name}`);
          }
          NODE

      - name: Deploy exact Team source to staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CF_API_TOKEN unavailable" >&2; exit 1; }
          short_sha="${TEAM_SHA:0:12}"
          npx wrangler deploy -c wrangler.staging.jsonc --tag "workforce-staging-${short_sha}" --message "Workforce staging ${TEAM_SHA}"

      - name: Verify exact active staging version provenance
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list -c wrangler.staging.jsonc --json > deployments.json
          deployment="$(jq -c --arg message "Workforce staging ${TEAM_SHA}" '[.[] | select(.annotations["workers/message"] == $message)] | last' deployments.json)"
          [ "$deployment" != "null" ] || { echo "Exact staging deployment provenance not found" >&2; exit 1; }
          version_id="$(jq -r '.versions[] | select(.percentage == 100) | .version_id' <<<"$deployment")"
          [ -n "$version_id" ] || { echo "Exact staging version is not active at 100%" >&2; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Active staging version: $version_id"

      - name: Smoke Workforce BO and TOS staging surfaces
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local path="$1" out="$2" code=""
            for _ in $(seq 1 12); do
              code="$(curl -sS --max-time 15 -o "$out" -w '%{http_code}' "${STAGING_URL}${path}")"
              [ "$code" = "200" ] && return 0
              sleep 2
            done
            echo "Smoke failed: ${path} -> ${code}" >&2
            cat "$out" >&2 || true
            return 1
          }
          probe "/api/bo/context" /tmp/bo-context.json
          probe "/api/bo/workforce/staff-records" /tmp/staff-records.json
          probe "/bo/workforce" /tmp/bo-workforce.html
          probe "/staff-login" /tmp/staff-login.html
          probe "/staff-pin/change" /tmp/staff-pin-change.html
          node -e 'for(const f of process.argv.slice(1)){const x=JSON.parse(require("fs").readFileSync(f,"utf8"));if(!Object.hasOwn(x,"data"))process.exit(1)}' /tmp/bo-context.json /tmp/staff-records.json
          echo "WORKFORCE_TEAM_STAGING_SMOKE=PASS"

      - name: Report staging PASS
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WORKFORCE_TEAM_STAGING_DEPLOY: PASS

          Team source: ${TEAM_SHA}
          Source PR: #${{ steps.gate.outputs.source_pr }}
          Worker: pino-team-os-staging
          Active version: ${{ steps.deployment.outputs.version_id }}
          BO Workforce API/page + Staff login/PIN-change pages: PASS

          Production Team Worker, production routes/domains, and production Core were not changed."

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WORKFORCE_TEAM_STAGING_DEPLOY: FAIL_SAFE

          Team source: ${TEAM_SHA:-unknown}
          No production Team Worker, production route/domain, or production Core mutation was authorized by this workflow."
