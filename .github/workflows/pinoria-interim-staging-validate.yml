name: Pinoria Interim Staging Validate

on:
  push:
    branches: [feat/pinoria-interim-ui-e2e, feat/pinoria-interim-ui-config-v2]
  pull_request:
    branches: [feat/pinoria-staging-tv-wish-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --check scripts/pinoria-staging-checkpoint-smoke.mjs
      - name: Read-only Pinoria staging smoke
        run: npm run test:pinoria-staging
