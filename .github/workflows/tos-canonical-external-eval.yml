name: TOS Canonical External Evaluation
run-name: ${{ github.event.issue.title == '[GPT] TOS canonical external evaluation' && github.event.issue.user.login == 'vmtct' && format('TOS canonical external evaluation #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED TOS canonical external evaluation #{0} @ {1}', github.event.issue.number, github.sha) }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: pino-team-production
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.issue.title == '[GPT] TOS canonical external evaluation' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCESS_API_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCESS_POLICY_TEST_TOKEN: ${{ secrets.CF_ACCESS_POLICY_TEST_TOKEN }}
      CF_ACCESS_POLICY_TEST_APPROVED_EMAIL: ${{ secrets.CF_ACCESS_POLICY_TEST_APPROVED_EMAIL }}
      CF_ACCESS_POLICY_TEST_BLOCKED_EMAIL: ${{ secrets.CF_ACCESS_POLICY_TEST_BLOCKED_EMAIL }}
      TOS_AUD: 9cc2708f62a198982d0597f520529a457e2b055c1835f77119a35286ac8de051
      BO_AUD: 7d0d94aa2028f9535283bf0745bfac0cb1cda4e7ebc5e76120fe300718c6559e
      OLD_POLICY: PINO Staff Core-gated OTP
      NEW_POLICY: PINO Staff Canonical External Evaluation
      EVALUATE_URL: https://pino-access-evaluator.minhtri-van42.workers.dev/evaluate
      KEYS_URL: https://pino-access-evaluator.minhtri-van42.workers.dev/keys
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Replace TOS everyone policy with canonical evaluator
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || { echo "Production Access mutation authority is one-shot; open a fresh Founder authorization issue instead of rerunning." >&2; exit 1; }
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          echo "AUTH_BODY_HASH=$AUTH_BODY_HASH" >> "$GITHUB_ENV"
          assert_live_team_main() {
            local checked_sha main_sha
            checked_sha="$(git rev-parse HEAD)"
            [ "$checked_sha" = "$GITHUB_SHA" ] || { echo "Checked-out Team source does not equal event SHA" >&2; return 1; }
            main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            [ "$main_sha" = "$checked_sha" ] || { echo "Team main advanced; stale source cannot mutate production" >&2; return 1; }
          }
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_ACCESS_API_TOKEN:-}" -H 'Content-Type: application/json')
          mutated=false
          original_payload=""
          desired_payload=""
          app_id=""
          policy_id=""
          comment() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$1"; }
          rollback() {
            if [ "$mutated" = true ] && [ -n "$app_id" ] && [ -n "$policy_id" ] && [ -n "$original_payload" ] && [ -n "$desired_payload" ]; then
              local live current
              live="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}" 2>/dev/null)" || return 1
              current="$(jq -Sc --arg id "$policy_id" '.result[]? | select(.id==$id) | {name,decision,precedence,include,exclude:(.exclude // []),require:(.require // [])}' <<<"$live" | head -1)"
              [ "$current" = "$original_payload" ] && return 0
              [ "$current" = "$desired_payload" ] || return 1
              curl -fsS -X PUT "${api}/access/apps/${app_id}/policies/${policy_id}" "${auth[@]}" -d "$original_payload" >/dev/null 2>&1 || return 1
            fi
          }
          fail() {
            rollback
            comment "TOS_CANONICAL_EXTERNAL_EVAL: **FAIL_SAFE**\n\n$1\n\nIf this run changed the TOS staff policy, the previous policy payload was restored. BO policy, D1, Staff data, Worker routes and domains were not authorized for mutation."
            exit 1
          }

          [ -n "${CF_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CF_ACCESS_API_TOKEN:-}" ] || fail "CF_ACCESS_API_TOKEN unavailable."
          target_sha="$(sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-f]{40})[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          confirm="$(sed -nE 's/^CONFIRM:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          mapfile -t evaluator_issue_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^EVALUATOR_SECRET_ISSUE:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p')
          mapfile -t evaluator_run_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^EVALUATOR_SECRET_RUN_ID:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p')
          [ "$confirm" = "RECONCILE_TOS_EXTERNAL_EVAL" ] || fail "Exact confirmation missing."
          [ -n "$target_sha" ] || fail "TEAM_SHA missing."
          [ "${#evaluator_issue_lines[@]}" -eq 1 ] || fail "Exactly one EVALUATOR_SECRET_ISSUE is required."
          [ "${#evaluator_run_lines[@]}" -eq 1 ] || fail "Exactly one EVALUATOR_SECRET_RUN_ID is required."
          evaluator_issue="${evaluator_issue_lines[0]}"; evaluator_run="${evaluator_run_lines[0]}"
          current_main="$(git rev-parse origin/main)"
          [ "$target_sha" = "$current_main" ] || fail "TEAM_SHA is not current main."
          bash scripts/assert-main-validation.sh "$GITHUB_REPOSITORY" "$target_sha" || fail "Current Team main lacks successful exact-head validation."
          [ "$GITHUB_SHA" = "$target_sha" ] || fail "Workflow checkout is not exact current main."
          [ -n "${CF_API_TOKEN:-}" ] || fail "CF_API_TOKEN unavailable for evaluator provider verification."
          [ -n "${CF_ACCESS_POLICY_TEST_TOKEN:-}" ] && [ -n "${CF_ACCESS_POLICY_TEST_APPROVED_EMAIL:-}" ] && [ -n "${CF_ACCESS_POLICY_TEST_BLOCKED_EMAIL:-}" ] || fail "Credential-dependent Access policy-test authority/identities unavailable."
          evaluator_authority="$(bash scripts/assert-evaluator-provider-authority.sh "$evaluator_issue" "$evaluator_run")" || fail "Evaluator provider authority is not canonical/current."
          evaluator_team_sha="$(jq -r '.teamSha' <<<"$evaluator_authority")"; evaluator_source_sha="$(jq -r '.evaluatorSha' <<<"$evaluator_authority")"; evaluator_version="$(jq -r '.version' <<<"$evaluator_authority")"; evaluator_deployment="$(jq -r '.deployment' <<<"$evaluator_authority")"
          [ "$evaluator_team_sha" = "$target_sha" ] || fail "Evaluator provider was not attested from this exact Team main."
          [[ "$evaluator_source_sha" =~ ^[0-9a-f]{40}$ ]] || fail "Evaluator provider lacks exact executable source identity."

          health_code="$(curl -sS -o /dev/null -w '%{http_code}' "${EVALUATE_URL%/evaluate}/health")"
          keys="$(curl -fsS "$KEYS_URL")" || fail "Evaluator keys endpoint is unavailable."
          [ "$health_code" = 200 ] || fail "Evaluator health endpoint is not HTTP 200."
          jq -e '.keys | length == 1 and .[0].kty == "RSA" and .[0].alg == "RS256"' <<<"$keys" >/dev/null || fail "Evaluator keys endpoint is invalid."

          apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")" || fail "Cannot read Access applications."
          jq -e '.success==true' <<<"$apps" >/dev/null || fail "Access applications API returned failure."
          matches="$(jq -c --arg aud "$TOS_AUD" '[.result[]? | select((.aud // "") == $aud)]' <<<"$apps")"
          [ "$(jq 'length' <<<"$matches")" -eq 1 ] || fail "Pinned TOS audience must resolve to exactly one Access app."
          app="$(jq -c '.[0]' <<<"$matches")"
          app_id="$(jq -r '.id // empty' <<<"$app")"
          app_aud="$(jq -r '.aud // empty' <<<"$app")"
          [ -n "$app_id" ] && [ "$app_aud" = "$TOS_AUD" ] || fail "Resolved TOS app is invalid."
          [ "$app_aud" != "$BO_AUD" ] || fail "TOS app collides with BO audience."

          policies="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}")" || fail "Cannot read TOS policies."
          jq -e '.success==true' <<<"$policies" >/dev/null || fail "TOS policy API returned failure."
          everyone_count="$(jq '[.result[]? | select(.decision=="allow" and any(.include[]?; has("everyone")))] | length' <<<"$policies")"
          [ "$everyone_count" -le 1 ] || fail "More than one TOS allow-everyone policy exists; refusing ambiguous mutation."
          payload="$(jq -Scn --arg name "$NEW_POLICY" --arg eval "$EVALUATE_URL" --arg keys "$KEYS_URL" '{name:$name,decision:"allow",precedence:50,include:[{external_evaluation:{evaluate_url:$eval,keys_url:$keys}}],exclude:[],require:[]}')"
          existing_named="$(jq -c --arg name "$NEW_POLICY" '[.result[]? | select(.name==$name and .decision=="allow")]' <<<"$policies")"
          [ "$(jq 'length' <<<"$existing_named")" -le 1 ] || fail "Canonical External Evaluation policy name is ambiguous."
          existing_external="$(jq -c '.[0] // empty' <<<"$existing_named")"
          old="$(jq -c --arg name "$OLD_POLICY" '.result[]? | select(.name==$name and .decision=="allow" and any(.include[]?; has("everyone")))' <<<"$policies" | head -1)"
          selected="$existing_external"
          [ -n "$selected" ] || selected="$old"
          [ -n "$selected" ] || fail "Neither canonical nor legacy TOS Staff policy was found."
          policy_id="$(jq -r '.id' <<<"$selected")"
          original_payload="$(jq -Sc '{name,decision,precedence,include,exclude:(.exclude // []),require:(.require // [])}' <<<"$selected")"
          desired_payload="$payload"
          if [ "$original_payload" != "$desired_payload" ]; then
            original_b64="$(printf '%s' "$original_payload" | base64 -w0)"
            desired_b64="$(printf '%s' "$desired_payload" | base64 -w0)"
            bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] TOS canonical external evaluation" "$AUTH_BODY_HASH"
            assert_live_team_main || fail "Team source authority drifted before production mutation."
            bash scripts/assert-no-core-verification-in-flight.sh || fail "Core PRE_GA verification/recovery overlaps this Team production mutation."
            bash scripts/assert-no-unresolved-recovery.sh || fail "An earlier Team production mutation has unresolved recovery authority."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "TOS_CANONICAL_EXTERNAL_EVAL: **RECOVERY_ARMED**\n\nWorkflow run: ${GITHUB_RUN_ID}\nWorkflow attempt: ${GITHUB_RUN_ATTEMPT}\nTeam source: ${GITHUB_SHA}\nApp ID: ${app_id}\nPolicy ID: ${policy_id}\nOriginal policy payload b64: ${original_b64}\nDesired policy payload b64: ${desired_b64}\n\nBaseline and exact run-owned desired state captured before the Access policy PUT." >/dev/null || fail "Could not persist External Evaluation recovery baseline."
            mutated=true
            updated="$(curl -fsS -X PUT "${api}/access/apps/${app_id}/policies/${policy_id}" "${auth[@]}" -d "$payload")" || fail "Cloudflare rejected External Evaluation policy update."
            jq -e '.success==true and (.result.id|length>0)' <<<"$updated" >/dev/null || fail "Cloudflare did not report successful policy update."
          fi

          verify="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}")" || fail "Cannot verify TOS policies after update."
          jq -e '.success==true' <<<"$verify" >/dev/null || fail "TOS policy verification API failed."
          policy_closure="$(node scripts/assert-tos-evaluator-policy-closure.mjs "$policy_id" "$NEW_POLICY" "$EVALUATE_URL" "$KEYS_URL" <<<"$verify")" || fail "TOS allow-policy closure does not require the canonical evaluator on every admission path."
          [ "$(jq -r '.unsafeAllowPolicies' <<<"$policy_closure")" = "0" ] || fail "TOS policy closure reported an unsafe allow path."

          bo="$(jq -c --arg aud "$BO_AUD" '[.result[]? | select((.aud // "") == $aud)]' <<<"$apps")"
          [ "$(jq 'length' <<<"$bo")" -eq 1 ] || fail "BO audience no longer resolves uniquely."
          bo_id="$(jq -r '.[0].id' <<<"$bo")"
          bo_policies="$(curl -fsS "${api}/access/apps/${bo_id}/policies?per_page=100" "${auth[@]}")" || fail "Cannot verify BO policies."
          jq -e '.success==true and ([.result[]? | select(.decision=="allow" and any(.include[]?; has("everyone")))] | length==0)' <<<"$bo_policies" >/dev/null || fail "BO policy invariant failed."
          policy_test="$(bash scripts/run-access-evaluator-policy-test.sh "$TOS_AUD" "$CF_ACCESS_POLICY_TEST_APPROVED_EMAIL" "$CF_ACCESS_POLICY_TEST_BLOCKED_EMAIL")" || fail "Cloudflare Access policy test did not prove credential-dependent evaluator behavior."
          policy_test_id="$(jq -r '.testId // empty' <<<"$policy_test")"
          [ -n "$policy_test_id" ] || fail "Access policy test produced no immutable test identity."
          headers="$RUNNER_TEMP/tos-external-eval-headers.txt"
          code="$(curl -sS --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' 'https://tos.pinohouse.art/staff-login' || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
          [ "$code" = 302 ] || [ "$code" = 303 ] || [ "$code" = 307 ] || fail "TOS perimeter no longer redirects to Cloudflare Access (HTTP ${code})."
          [[ "$location" == *"cloudflareaccess.com/cdn-cgi/access/login/tos.pinohouse.art"* ]] || fail "TOS challenge endpoint drifted."
          [[ "$location" == *"kid=${TOS_AUD}"* ]] || fail "TOS audience drifted after policy update."

          state="reused"
          [ "$mutated" = true ] && state="reconciled"
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] TOS canonical external evaluation" "$AUTH_BODY_HASH"
          assert_live_team_main || fail "Team source authority drifted before terminal PASS."
          bash scripts/assert-no-core-verification-in-flight.sh || fail "Core PRE_GA verification/recovery overlaps terminal Team evidence."
          evaluator_final="$(bash scripts/assert-evaluator-provider-authority.sh "$evaluator_issue" "$evaluator_run")" || fail "Evaluator authority drifted before terminal PASS."
          [ "$(jq -r '.teamSha' <<<"$evaluator_final")" = "$target_sha" ] && [ "$(jq -r '.evaluatorSha' <<<"$evaluator_final")" = "$evaluator_source_sha" ] && [ "$(jq -r '.version' <<<"$evaluator_final")" = "$evaluator_version" ] && [ "$(jq -r '.deployment' <<<"$evaluator_final")" = "$evaluator_deployment" ] || fail "Evaluator provider identity drifted before terminal PASS."
          comment "TOS_CANONICAL_EXTERNAL_EVAL: **PASS**\n\n- Workflow run: ${GITHUB_RUN_ID}\n- Workflow attempt: ${GITHUB_RUN_ATTEMPT}\n- Team source guard: ${target_sha}\n- TOS app: ${app_id}\n- TOS audience: ${TOS_AUD}\n- Staff perimeter policy: ${state} (${policy_id})\n- Allow Everyone policies on TOS: 0\n- Evaluator: ${EVALUATE_URL}\n- Evaluator secret issue/run: #${evaluator_issue} / ${evaluator_run}\n- Evaluator source: ${evaluator_source_sha}\n- Evaluator version/deployment: ${evaluator_version} / ${evaluator_deployment}\n- Evaluator key: RSA/RS256 ready\n- Credential-dependent Access policy test: ${policy_test_id}\n- TOS evaluator policy closure: exact canonical policy + all other allows require evaluator\n- BO allow-everyone policies: 0\n- TOS challenge preserved (HTTP ${code})\n\nCloudflare now asks the canonical evaluator after OTP; evaluator fails closed unless pino-core authorizes an active TOS Staff principal. BO policy, D1, Staff data, Team/Core runtime, routes and domains were not mutated by this operator."
          mutated=false
