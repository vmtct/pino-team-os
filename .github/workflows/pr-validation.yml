name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Verify Project-Code metadata
        if: github.event_name == 'pull_request'
        env:
          PINO_PR_BODY: ${{ github.event.pull_request.body }}
          PINO_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/verify-pr-project-code.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Enforce BO Architecture Contract (PAP-926)
        run: |
          node scripts/verify-bo-module-contract.mjs
          node --test scripts/verify-bo-module-contract.test.mjs
      - name: Check BO V2.3 pilot parity contract (PAP-889)
        run: |
          node --test scripts/verify-bo-v23-parity.test.mjs
          node scripts/verify-bo-v23-parity.mjs --mode=adopted
          node --test scripts/verify-bo-v23-foundation.test.mjs
          node scripts/verify-bo-v23-foundation.mjs
          node --test scripts/verify-bo-v23-quick-view.test.mjs
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

      - name: Build isolated greenfield preview artifact
        run: |
          bunx opennextjs-cloudflare build
          test -f .open-next/worker.js
          bunx wrangler deploy --dry-run --config wrangler.greenfield-preview.json
