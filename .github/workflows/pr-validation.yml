name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Verify Project-Code metadata
        if: github.event_name == 'pull_request'
        env:
          PINO_PR_BODY: ${{ github.event.pull_request.body }}
          PINO_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/verify-pr-project-code.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verify PAP-659 build manifest provenance
        run: |
          node --test scripts/pap659-build-provenance.test.mjs scripts/pap659-package-provenance.test.mjs
          node scripts/pap659-build-provenance.mjs .next
      - name: Retain PAP-659 build provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: pap659-build-provenance
          path: .next/pap659-build-provenance.json
          if-no-files-found: error
          retention-days: 7
