name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/pap879-core-pilot-adapters-20261024, feat/pap979-full-detail-v25]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Enforce BO Architecture Contract (PAP-926)
        run: |
          node scripts/verify-bo-module-contract.mjs
          node --test scripts/verify-bo-module-contract.test.mjs
          node scripts/verify-bo-staging-route-policy.mjs
          node --test scripts/verify-bo-staging-route-policy.test.mjs
          node scripts/verify-bo-runtime-surface-ownership.mjs
          node --test scripts/verify-bo-runtime-surface-ownership.test.mjs
      - name: Check BO V2.3 pilot parity contract (PAP-889)
        run: |
          node --test public/bo-ui-replica/*.test.cjs
          node --test scripts/verify-bo-v23-parity.test.mjs
          node scripts/verify-bo-v23-parity.mjs --mode=adopted
          node --test scripts/verify-bo-v23-foundation.test.mjs
          node scripts/verify-bo-v23-foundation.mjs
          node --test scripts/verify-bo-v23-quick-view.test.mjs
      - name: Enforce TOS DS V4 runtime contract (PAP-1014)
        run: bun run tos:ds:check
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: BO authority and isolation contracts (PAP-1022)
        run: |
          node scripts/build-bo-authority.mjs --check
          node scripts/build-ho-authority.mjs --check
          node --import tsx --test lib/bo-css-authority.test.ts lib/ho-css-authority.test.ts lib/bo-registration-styles.test.ts lib/bo-skeleton.test.ts
          echo "BROWSER_E2E=NOT_RUN_FOUNDER_POLICY"
      - name: Release confidence smoke and recovery regression tests
        run: node --test scripts/release-confidence-smoke.test.mjs scripts/release-confidence-guard.test.mjs
      - name: Build
        run: bun run build
      - name: Verify PAP-659 build manifest provenance
        run: |
          node --test scripts/pap659-build-provenance.test.mjs scripts/pap659-package-provenance.test.mjs
          node scripts/pap659-build-provenance.mjs .next
      - name: Verify PAP-659 OpenNext asset packaging
        run: |
          npx opennextjs-cloudflare build
          node scripts/pap659-package-provenance.mjs .next .open-next/assets
          test -f .open-next/worker.js
          test -f .open-next/assets/pap659-build-provenance.json
      - name: Retain PAP-659 build provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: pap659-build-provenance
          path: .next/pap659-build-provenance.json
          if-no-files-found: error
          retention-days: 7

  dispatch_staging_after_main_validation:
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch guarded staging CD for the exact main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$SOURCE_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/candidate-staging-deploy.yml/dispatches" \
            -f ref=main -f "inputs[source_sha]=$SOURCE_SHA" -f "inputs[validation_run_id]=$VALIDATION_RUN"
          echo "DISPATCH_TEAM_STAGING_CD source=$SOURCE_SHA validation=$VALIDATION_RUN"
