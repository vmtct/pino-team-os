name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Verify Project-Code metadata
        env:
          PINO_PR_BODY: ${{ github.event.pull_request.body }}
          PINO_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/verify-pr-project-code.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
