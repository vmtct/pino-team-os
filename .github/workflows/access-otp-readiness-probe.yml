name: Access OTP Readiness Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: access-otp-readiness-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.issue.title == '[GPT] Access OTP readiness probe' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Read live Access configuration
        shell: bash
        run: |
          set -euo pipefail
          fail() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_OTP_READINESS_PROBE: **FAIL_SAFE**\n\n$1\n\nRead-only probe; no Access or production mutation was attempted."; exit 1; }
          [ -n "${CF_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CF_TOKEN:-}" ] || fail "CF_API_TOKEN unavailable."
          target_hash="$(sed -nE 's/^TARGET_EMAIL_SHA256:[[:space:]]*([0-9a-f]{64})[[:space:]]*$/\1/p' <<<"$ISSUE_BODY")"
          target_domain="$(sed -nE 's/^TARGET_DOMAIN:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' <<<"$ISSUE_BODY" | tr '[:upper:]' '[:lower:]')"
          [ -n "$target_hash" ] && [ -n "$target_domain" ] || fail "Missing target hash/domain."
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_TOKEN}" -H 'Content-Type: application/json')
          apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")" || fail "Cannot read account-scoped Access applications."
          idps="$(curl -fsS "${api}/access/identity_providers" "${auth[@]}")" || fail "Cannot read Access identity providers."
          jq -e '.success==true' <<<"$apps" >/dev/null || fail "Access applications API returned failure."
          jq -e '.success==true' <<<"$idps" >/dev/null || fail "Identity providers API returned failure."
          otp_ids="$(jq -r '.result[]? | select(.type=="onetimepin") | .id' <<<"$idps")"
          otp_count="$(wc -w <<<"$otp_ids" | tr -d ' ')"
          summary=""
          app_count=0
          for domain in tos.pinohouse.art bo.pinohouse.art; do
            app="$(jq -c --arg d "$domain" '.result[]? | select((tojson | contains($d)))' <<<"$apps" | head -1)"
            if [ -z "$app" ]; then summary+="- ${domain}: app_missing\n"; continue; fi
            app_count=$((app_count+1))
            app_id="$(jq -r '.id' <<<"$app")"
            allowed_idps="$(jq -c '.allowed_idps // []' <<<"$app")"
            otp_allowed=false
            if [ "$(jq 'length' <<<"$allowed_idps")" -eq 0 ] && [ "$otp_count" -gt 0 ]; then otp_allowed=true; fi
            for oid in $otp_ids; do jq -e --arg x "$oid" 'index($x)!=null' <<<"$allowed_idps" >/dev/null && otp_allowed=true || true; done
            policies="$(curl -fsS "${api}/access/apps/${app_id}/policies?per_page=100" "${auth[@]}")" || fail "Cannot read policies for ${domain}."
            jq -e '.success==true' <<<"$policies" >/dev/null || fail "Policies API failed for ${domain}."
            allow_match=false; allow_everyone=false; allow_policy_count=0; include_types=""
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              [ "$(jq -r '.decision' <<<"$p")" = "allow" ] || continue
              allow_policy_count=$((allow_policy_count+1))
              types="$(jq -r '.include[]? | keys[]' <<<"$p" | sort -u | paste -sd, -)"
              include_types+="${types};"
              jq -e '.include[]? | has("everyone")' <<<"$p" >/dev/null 2>&1 && { allow_everyone=true; allow_match=true; } || true
              while IFS= read -r e; do [ -n "$e" ] || continue; h="$(printf '%s' "$(tr '[:upper:]' '[:lower:]' <<<"$e")" | sha256sum | awk '{print $1}')"; [ "$h" = "$target_hash" ] && allow_match=true; done < <(jq -r '.include[]? | .email.email? // empty' <<<"$p")
              while IFS= read -r d; do [ "$(tr '[:upper:]' '[:lower:]' <<<"$d")" = "$target_domain" ] && allow_match=true; done < <(jq -r '.include[]? | .email_domain.domain? // empty' <<<"$p")
            done < <(jq -c '.result[]?' <<<"$policies")
            summary+="- ${domain}: otp_allowed=${otp_allowed}, allow_match=${allow_match}, allow_everyone=${allow_everyone}, allow_policy_count=${allow_policy_count}, include_types=${include_types:-none}\n"
          done
          [ "$app_count" -gt 0 ] || fail "No account-scoped Access app record contains the TOS/BO hostname in domain/destination metadata."
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_OTP_READINESS_PROBE: **PASS**\n\n- OTP identity provider count: ${otp_count}\n${summary}\nRead-only live Zero Trust reconciliation. Target email was compared only by SHA-256; no email address was written to logs or GitHub. No mutation performed."
