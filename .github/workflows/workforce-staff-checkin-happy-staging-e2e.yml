name: Workforce Staff Check-In Happy Staging E2E
run-name: "${{ github.event.issue.title == '[GPT] Workforce staff check-in happy staging E2E' && github.event.issue.user.login == 'vmtct' && format('Workforce Staff Check-In Happy Staging E2E #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED Workforce Staff Check-In happy staging issue #{0} @ {1}', github.event.issue.number, github.sha) }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: "${{ github.event.issue.title == '[GPT] Workforce staff check-in happy staging E2E' && github.event.issue.user.login == 'vmtct' && 'pino-team-staging-worker-mutation' || format('{0}-{1}', github.workflow, github.run_id) }}"
  cancel-in-progress: false

jobs:
  happy:
    if: github.event.issue.title == '[GPT] Workforce staff check-in happy staging E2E' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
      CORE_REPOSITORY: vmtct/pino-core
      CORE_RELEASE_GH_TOKEN: ${{ secrets.PINO_CORE_RELEASE_READ_TOKEN }}
      CORE_STAGING_WORKER: pino-core-staging
      STAGING_URL: https://pino-team-os-staging.minhtri-van42.workers.dev
      PINO_STAGING_STAFF_EMAIL: workforce-staff-checkin-staging-probe@pino.invalid
      PINO_STAGING_STAFF_PASSWORD: ${{ secrets.PINO_STAGING_STAFF_PASSWORD }}

    steps:
      - name: Validate happy-journey request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          echo "AUTH_BODY_HASH=$AUTH_BODY_HASH" >> "$GITHUB_ENV"
          reject() {
            {
              echo "WORKFORCE_STAFF_CHECKIN_HAPPY_STAGING_E2E: REJECTED"
              echo
              echo "$1"
              echo
              echo "No staging or Production mutation was attempted."
            } > "$RUNNER_TEMP/reject.txt"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reject.txt"
            exit 1
          }

          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || reject "Happy journey authority is one-shot; create a fresh issue for retry."
          mapfile -t team_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          mapfile -t core_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^CORE_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          mapfile -t team_run_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^TEAM_STAGING_RUN_ID:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p')
          mapfile -t fixture_run_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^CORE_FIXTURE_RUN_ID:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p')
          [ "${#team_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one TEAM_SHA line."
          [ "${#core_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one CORE_SHA line."
          [ "${#team_run_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one TEAM_STAGING_RUN_ID line."
          [ "${#fixture_run_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one CORE_FIXTURE_RUN_ID line."
          grep -Eq '^CONFIRM:[[:space:]]*RUN_WORKFORCE_STAFF_CHECKIN_HAPPY_STAGING_E2E[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing explicit confirmation."

          team_sha="$(tr 'A-F' 'a-f' <<<"${team_lines[0]}")"
          core_sha="$(tr 'A-F' 'a-f' <<<"${core_lines[0]}")"
          team_run_id="${team_run_lines[0]}"
          fixture_run_id="${fixture_run_lines[0]}"

          team_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" || reject "Cannot resolve Team main."
          [ "$team_sha" = "$team_main" ] || reject "Requested TEAM_SHA is not current Team main."

          team_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${team_sha}&event=push&per_page=30")"
          latest_team_build="$(jq -c '[.workflow_runs[] | select(.name=="Cloudflare Build + Serving Truth")] | sort_by(.updated_at // .run_started_at // .created_at // "") | last // empty' <<<"$team_runs")"
          jq -e '.status=="completed" and .conclusion=="success"' <<<"$latest_team_build" >/dev/null || reject "Newest exact-main Team serving-truth workflow is not terminal success."

          core_token="${CORE_RELEASE_GH_TOKEN:?PINO_CORE_RELEASE_READ_TOKEN unavailable}"
          core_main="$(GH_TOKEN="$core_token" gh api "/repos/${CORE_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" || reject "Cannot resolve Core main."
          [ "$core_sha" = "$core_main" ] || reject "Requested CORE_SHA is not current Core main."

          core_ci="$(GH_TOKEN="$core_token" gh api "/repos/${CORE_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${core_sha}&branch=main&status=completed&per_page=20")"
          jq -e --arg sha "$core_sha" '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success")] | length >= 1' <<<"$core_ci" >/dev/null || reject "No successful exact-main Core CI exists."

          fixture_run="$(GH_TOKEN="$core_token" gh api "/repos/${CORE_REPOSITORY}/actions/runs/${fixture_run_id}")" || reject "Cannot read Core fixture run."
          jq -e --arg sha "$core_sha" '
            .head_sha==$sha
            and .event=="issues"
            and .status=="completed"
            and .conclusion=="success"
            and .actor.login=="vmtct"
            and .triggering_actor.login=="vmtct"
            and .path==".github/workflows/workforce-staff-checkin-staging-fixture.yml"
          ' <<<"$fixture_run" >/dev/null || reject "Core fixture run is not a successful exact-SHA Staff Check-In fixture authority."

          echo "TEAM_SHA=$team_sha" >> "$GITHUB_ENV"
          echo "CORE_SHA=$core_sha" >> "$GITHUB_ENV"
          echo "TEAM_STAGING_RUN_ID=$team_run_id" >> "$GITHUB_ENV"
          echo "CORE_FIXTURE_RUN_ID=$fixture_run_id" >> "$GITHUB_ENV"
          echo "team_sha=$team_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.team_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          test "$(git rev-parse HEAD)" = "$TEAM_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify exact active Team and Core staging revisions
        id: staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CF_API_TOKEN unavailable" >&2; exit 1; }

          npx wrangler deployments status -c wrangler.staging.jsonc --json > "$RUNNER_TEMP/team-staging.json"
          team_message="$(jq -r '.annotations["workers/message"] // ""' "$RUNNER_TEMP/team-staging.json")"
          [ "$team_message" = "Workforce staging ${TEAM_SHA} run ${TEAM_STAGING_RUN_ID}" ] || { echo "Active Team staging provenance does not match exact Team SHA/run" >&2; exit 1; }
          mapfile -t team_versions < <(jq -r '.versions[]? | select(.percentage == 100) | .version_id // empty' "$RUNNER_TEMP/team-staging.json")
          [ "${#team_versions[@]}" -eq 1 ] || { echo "Team staging must have one 100% active version" >&2; exit 1; }
          team_version_id="${team_versions[0]}"

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          core_state="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_STAGING_WORKER}/deployments" "${auth[@]}")"
          jq -e '.success == true' <<<"$core_state" >/dev/null
          core_deployment_id="$(jq -r '.result.deployments[0].id // empty' <<<"$core_state")"
          core_marker="$(jq -r '.result.deployments[0].annotations["workers/message"] // empty' <<<"$core_state")"
          mapfile -t core_versions < <(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$core_state")
          [ -n "$core_deployment_id" ] && [ "${#core_versions[@]}" -eq 1 ] || { echo "Core staging must have one exact active deployment/version" >&2; exit 1; }
          core_version_id="${core_versions[0]}"
          if [[ ! "$core_marker" =~ ^PINO_STAGING_RUNTIME_EVIDENCE:([0-9a-f]{40}):([0-9]+):([1-9][0-9]*):([0-9a-f-]{36})$ ]]; then
            echo "Core staging deployment marker is not canonical runtime evidence" >&2
            exit 1
          fi
          [ "${BASH_REMATCH[1]}" = "$CORE_SHA" ] || { echo "Active Core staging SHA does not match requested CORE_SHA" >&2; exit 1; }

          core_run_id="${BASH_REMATCH[2]}"
          core_run_attempt="${BASH_REMATCH[3]}"
          core_token="${CORE_RELEASE_GH_TOKEN:?PINO_CORE_RELEASE_READ_TOKEN unavailable}"
          core_run="$(GH_TOKEN="$core_token" gh api "/repos/${CORE_REPOSITORY}/actions/runs/${core_run_id}")"
          jq -e --arg sha "$CORE_SHA" --argjson attempt "$core_run_attempt" '
            .head_sha==$sha
            and .event=="issues"
            and .status=="completed"
            and .conclusion=="success"
            and .actor.login=="vmtct"
            and .triggering_actor.login=="vmtct"
            and .path==".github/workflows/open-studio-core-staging-deploy.yml"
            and .run_attempt==$attempt
          ' <<<"$core_run" >/dev/null || { echo "Core staging deployment run provenance is invalid" >&2; exit 1; }

          echo "team_version_id=$team_version_id" >> "$GITHUB_OUTPUT"
          echo "core_deployment_id=$core_deployment_id" >> "$GITHUB_OUTPUT"
          echo "core_version_id=$core_version_id" >> "$GITHUB_OUTPUT"
          echo "core_run_id=$core_run_id" >> "$GITHUB_OUTPUT"

      - name: Revalidate issue authority before happy-path mutation
        shell: bash
        run: |
          set -euo pipefail
          body_hash="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          [ "$body_hash" = "$AUTH_BODY_HASH" ] || { echo "Issue body drifted" >&2; exit 1; }
          current_team="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_team" = "$TEAM_SHA" ] || { echo "Team main drifted" >&2; exit 1; }
          core_token="${CORE_RELEASE_GH_TOKEN:?PINO_CORE_RELEASE_READ_TOKEN unavailable}"
          current_core="$(GH_TOKEN="$core_token" gh api "/repos/${CORE_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_core" = "$CORE_SHA" ] || { echo "Core main drifted" >&2; exit 1; }

      - name: Run UI-driven, API-verified happy journey
        env:
          PINO_HAPPY_RECEIPT_PATH: ${{ runner.temp }}/wfm-staff-checkin-happy-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${PINO_STAGING_STAFF_EMAIL:-}" ] && [ -n "${PINO_STAGING_STAFF_PASSWORD:-}" ] || { echo "Missing staging Staff credentials" >&2; exit 1; }
          npx playwright test e2e/wfm-staff-checkin-happy-staging.spec.ts --workers=1 --retries=0
          test -s "$PINO_HAPPY_RECEIPT_PATH"
          jq -e '
            .journey_id=="GJ-WFM-STAFF-CHECKIN-01"
            and .mode=="UI_DRIVEN_API_VERIFIED"
            and .result=="PASS"
            and ([.checks[]] | all(.=="PASS"))
          ' "$PINO_HAPPY_RECEIPT_PATH" >/dev/null

      - name: Upload happy journey receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfm-staff-checkin-happy-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/wfm-staff-checkin-happy-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/wfm-staff-checkin-happy-receipt.json"
          session_id="$(jq -r '.timekeeping_session_id' "$receipt")"
          {
            echo "WORKFORCE_STAFF_CHECKIN_HAPPY_STAGING_E2E: PASS"
            echo
            echo "Golden Journey: GJ-WFM-STAFF-CHECKIN-01"
            echo "Mode: UI_DRIVEN_API_VERIFIED"
            echo "Team source: ${TEAM_SHA}"
            echo "Team staging run/version: ${TEAM_STAGING_RUN_ID} / ${{ steps.staging.outputs.team_version_id }}"
            echo "Core source: ${CORE_SHA}"
            echo "Core staging run/deployment/version: ${{ steps.staging.outputs.core_run_id }} / ${{ steps.staging.outputs.core_deployment_id }} / ${{ steps.staging.outputs.core_version_id }}"
            echo "Core fixture run: ${CORE_FIXTURE_RUN_ID}"
            echo "Timekeeping session: ${session_id}"
            echo "Checks: Staff login UI -> briefing UI -> Check-in UI -> Core timekeeping API -> Team Pinoria presence API"
            echo "Cleanup: PASS; current TimekeepingSession returned to null."
            echo
            echo "No Production mutation was performed."
          } > "$RUNNER_TEMP/pass.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pass.txt"

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            echo "WORKFORCE_STAFF_CHECKIN_HAPPY_STAGING_E2E: FAIL_SAFE"
            echo
            echo "Team source: ${TEAM_SHA:-unknown}"
            echo "Core source: ${CORE_SHA:-unknown}"
            echo "Core fixture run: ${CORE_FIXTURE_RUN_ID:-unknown}"
            echo "Failure may be UI, API/runtime, fixture, authority, or tooling; this workflow does not classify it as a Product defect automatically."
            echo "No Production mutation was authorized."
          } > "$RUNNER_TEMP/failure.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/failure.txt" || true
