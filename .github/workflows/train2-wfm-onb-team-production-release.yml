name: Train2 WFM-ONB Team Production Release

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: train2-wfm-onb-team-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.issue.title == '[GPT] Train2 WFM-ONB Team production release' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      TARGET_SHA: 194f558aff4da3707e20ebea102b8559db61033f
      PROD_BASE: 77bab97d9b49b6aa681e658ba6688222d436d63d
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TEAM_WORKER: pino-team-os
      CORE_WORKER: pino-core
      TOS_HOST: tos.pinohouse.art
      BO_HOST: bo.pinohouse.art
      ZONE_ID: 48b2809afabf3d65d30f80f346126213

    steps:
      - name: Validate Founder release request and staging evidence
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          reject() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "TRAIN2_WFM_ONB_TEAM_RELEASE: **REJECTED**\n\n$1\n\nNo production mutation was attempted."; exit 1; }
          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^CANDIDATE_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          mapfile -t evidence_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^EVIDENCE_ISSUE:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || reject "Issue must contain exactly one CANDIDATE_SHA."
          [ "${#evidence_lines[@]}" -eq 1 ] || reject "Issue must contain exactly one EVIDENCE_ISSUE."
          requested="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          evidence_issue="${evidence_lines[0]}"
          [ "$requested" = "$TARGET_SHA" ] || reject "Requested SHA is not the frozen Train 2 Team candidate."
          [ "$evidence_issue" = "288" ] || reject "Evidence issue must be Team mirror #288."
          grep -Eq '^CONFIRM:[[:space:]]*RELEASE_TRAIN2_WFM_TEAM_PRODUCTION[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing explicit production confirmation."
          evidence="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${evidence_issue}")" || reject "Cannot read staging evidence issue."
          [ "$(jq -r '.user.login' <<<"$evidence")" = "vmtct" ] || reject "Evidence issue was not opened by Founder."
          body="$(jq -r '.body // ""' <<<"$evidence")"
          grep -Fq 'STATUS: FULL_STAGING_E2E_PASS' <<<"$body" || reject "FULL staging E2E PASS is absent."
          grep -Fq 'CORE_SHA: 840fed2f548f9b08db914bd3086b43a7b150283e' <<<"$body" || reject "Evidence does not bind exact Core pair."
          grep -Fq "TEAM_SHA: ${TARGET_SHA}" <<<"$body" || reject "Evidence does not bind exact Team SHA."
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&status=completed&per_page=50")" || reject "Cannot read exact-head CI evidence."
          jq -e --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .conclusion=="success")] | length >= 1' <<<"$runs" >/dev/null || reject "No successful exact-head CI exists for Team candidate."
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/273")" || reject "Cannot read canonical Team WFM PR #273."
          [ "$(jq -r '.merged_at // empty' <<<"$pr")" != "" ] || reject "Canonical Team WFM PR #273 is not merged."
          [ "$(jq -r '.base.ref' <<<"$pr")" = "main" ] || reject "Canonical Team WFM PR #273 did not target main."
          echo "evidence_issue=$evidence_issue" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and rebuild Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git merge-base "$PROD_BASE" "$TARGET_SHA")" = "$PROD_BASE"
          test "$(git rev-list --count "$PROD_BASE..$TARGET_SHA")" = "5"
          git diff --check "$PROD_BASE" "$TARGET_SHA"
          actual="$(git diff --name-only "$PROD_BASE" "$TARGET_SHA" | sort)"
          expected="$(printf '%s\n' 'app/bo/bo.module.css' 'app/bo/staff/StaffManagementView.tsx' 'lib/bo-api.ts' 'lib/bo-boundary.test.ts' 'lib/bo-model.ts' 'lib/bo-write-handler.test.ts' 'lib/bo-write-handler.ts' 'lib/host-boundary.test.ts' 'lib/host-boundary.ts' | sort)"
          [ "$actual" = "$expected" ] || { echo "Train 2 Team file allowlist drifted." >&2; exit 1; }
          npm ci
          npm run pino:verify
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
          test -z "$(git status --porcelain)"

      - name: Production preflight and upload exact version
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          repo="$GITHUB_REPOSITORY"
          release_message="Train2 WFM-ONB Team production ${TARGET_SHA} base ${PROD_BASE}"
          release_tag="train2-wfm-team-${TARGET_SHA:0:12}"
          fail() {
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "TRAIN2_WFM_ONB_TEAM_RELEASE: **FAIL_SAFE**\n\n$1\n\nNo Team production traffic was changed."
            exit 1
          }

          deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/deployments" "${auth[@]}")" || fail "Cannot inspect current Team deployment."
          old_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployments" | head -1)"
          [ -n "$old_version" ] || fail "Cannot resolve current 100% Team version."
          old_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/versions/${old_version}" "${auth[@]}")" || fail "Cannot inspect current Team version."
          old_message="$(jq -r '.result.annotations["workers/message"] // empty' <<<"$old_detail")"
          core_deployments="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/deployments" "${auth[@]}")" || fail "Cannot inspect active Core dependency."
          core_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$core_deployments" | head -1)"
          [ -n "$core_version" ] || fail "Cannot resolve active Core dependency version."
          core_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/versions/${core_version}" "${auth[@]}")" || fail "Cannot inspect active Core dependency version."
          core_message="$(jq -r '.result.annotations["workers/message"] // empty' <<<"$core_detail")"
          [ "$core_message" = "Train2 WFM-ONB Core production 840fed2f548f9b08db914bd3086b43a7b150283e base e9949c3da0106ad0973fff8fc8ae71d7fd68a135" ] || fail "Train 2 Core candidate is not active before Team rollout: ${core_message:-unknown}."
          for handler in BoAccessControlPlane StaffPinControlPlane; do
            jq -e --arg h "$handler" '[.result.resources.script.named_handlers[]?.name] | index($h) != null' <<<"$core_detail" >/dev/null || fail "Active Train 2 Core lost entrypoint ${handler}."
          done

          if [ "$old_message" = "$release_message" ]; then
            for binding in PINO_CORE PINO_WORKFORCE_CORE PINO_BO_CORE PINO_TOS_LEARNING_CORE PINO_STAFF_PIN_CORE PINO_PINORIA_TV_CORE PINO_ACCESS_SYNC; do
              jq -e --arg b "$binding" '[.result.resources.bindings[]?.name] | index($b) != null' <<<"$old_detail" >/dev/null || fail "Already-active Team candidate lost binding ${binding}."
            done
            echo "already_active=true" >> "$GITHUB_OUTPUT"
            echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
            echo "version_id=$old_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$old_message" = "Train1 PLT-TOS BO production ${PROD_BASE}" ] || fail "Active Team drifted from reviewed Train 1 production base: ${old_message:-unknown}."

          domains="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/domains" "${auth[@]}")" || fail "Cannot inspect Worker domains."
          for host in "$TOS_HOST" "$BO_HOST"; do
            jq -e --arg h "$host" --arg s "$TEAM_WORKER" '[.result[]? | select(.hostname==$h and .service==$s)] | length == 1' <<<"$domains" >/dev/null || fail "${host} is not attached exactly once to Team OS."
          done
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.service==$s)] | length == 0' <<<"$domains" >/dev/null || fail "Core unexpectedly owns a custom domain."
          routes="$(curl -fsS "${api}/zones/${ZONE_ID}/workers/routes" "${auth[@]}")" || fail "Cannot inspect zone routes."
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.script==$s)] | length == 0' <<<"$routes" >/dev/null || fail "Core has a public zone route."
          subdomain="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/subdomain" "${auth[@]}")" || fail "Cannot inspect Team workers.dev state."
          jq -e '.result.enabled == false and .result.previews_enabled == false' <<<"$subdomain" >/dev/null || fail "Production Team workers.dev or previews are enabled."

          upload_output="$RUNNER_TEMP/version-upload.ndjson"
          rm -f "$upload_output"
          WRANGLER_OUTPUT_FILE_PATH="$upload_output" CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" \
            npx wrangler versions upload -c wrangler.jsonc --tag "$release_tag" --message "$release_message" >/dev/null \
            || fail "Exact Train 2 candidate upload failed before traffic changed."
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$upload_output" | tail -1)"
          [ -n "$version_id" ] || fail "Candidate upload returned no version ID."
          detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/versions/${version_id}" "${auth[@]}")" || fail "Cannot inspect uploaded candidate."
          [ "$(jq -r '.result.annotations["workers/message"] // empty' <<<"$detail")" = "$release_message" ] || fail "Uploaded version annotation mismatch."
          for binding in PINO_CORE PINO_WORKFORCE_CORE PINO_BO_CORE PINO_TOS_LEARNING_CORE PINO_STAFF_PIN_CORE PINO_PINORIA_TV_CORE PINO_ACCESS_SYNC; do
            jq -e --arg b "$binding" '[.result.resources.bindings[]?.name] | index($b) != null' <<<"$detail" >/dev/null || fail "Uploaded candidate lost required binding ${binding}."
          done
          jq -r '[.result.resources.bindings[]?.name] | sort | unique | .[]' <<<"$old_detail" > "$RUNNER_TEMP/old-bindings.txt"
          jq -r '[.result.resources.bindings[]?.name] | sort | unique | .[]' <<<"$detail" > "$RUNNER_TEMP/new-bindings.txt"
          diff -u "$RUNNER_TEMP/old-bindings.txt" "$RUNNER_TEMP/new-bindings.txt" || fail "Uploaded candidate binding-name set drifted from current production."
          for binding in CF_ACCESS_TEAM_DOMAIN CF_ACCESS_TOS_AUD CF_ACCESS_BO_AUD FOUNDER_EMAIL; do
            old_value="$(jq -r --arg b "$binding" '.result.resources.bindings[]? | select(.name==$b) | .text // empty' <<<"$old_detail")"
            new_value="$(jq -r --arg b "$binding" '.result.resources.bindings[]? | select(.name==$b) | .text // empty' <<<"$detail")"
            [ -n "$old_value" ] && [ "$new_value" = "$old_value" ] || fail "Critical plain-text binding ${binding} drifted during upload."
          done
          for binding in PINO_CORE PINO_WORKFORCE_CORE PINO_BO_CORE PINO_TOS_LEARNING_CORE PINO_STAFF_PIN_CORE PINO_PINORIA_TV_CORE PINO_ACCESS_SYNC; do
            old_service="$(jq -c --arg b "$binding" '.result.resources.bindings[]? | select(.name==$b) | {service,entrypoint,environment}' <<<"$old_detail")"
            new_service="$(jq -c --arg b "$binding" '.result.resources.bindings[]? | select(.name==$b) | {service,entrypoint,environment}' <<<"$detail")"
            [ -n "$old_service" ] && [ "$new_service" = "$old_service" ] || fail "Critical service binding ${binding} drifted during upload."
          done

          after_upload="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/deployments" "${auth[@]}")" || fail "Cannot verify no-traffic upload."
          still_active="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$after_upload" | head -1)"
          [ "$still_active" = "$old_version" ] || fail "Traffic changed during version upload."
          echo "already_active=false" >> "$GITHUB_OUTPUT"
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Promote exact version with rollback
        shell: bash
        env:
          OLD_VERSION: ${{ steps.preflight.outputs.old_version }}
          TARGET_VERSION: ${{ steps.preflight.outputs.version_id }}
          ALREADY_ACTIVE: ${{ steps.preflight.outputs.already_active }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          repo="$GITHUB_REPOSITORY"
          serving_changed=0
          core_now="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/deployments" "${auth[@]}")" || fail "Cannot re-check Core dependency before Team promotion."
          core_now_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$core_now" | head -1)"
          core_now_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/versions/${core_now_version}" "${auth[@]}")" || fail "Cannot inspect Core dependency before Team promotion."
          core_now_message="$(jq -r '.result.annotations["workers/message"] // empty' <<<"$core_now_detail")"
          [ "$core_now_message" = "Train2 WFM-ONB Core production 840fed2f548f9b08db914bd3086b43a7b150283e base e9949c3da0106ad0973fff8fc8ae71d7fd68a135" ] || fail "Core drifted before Team traffic promotion: ${core_now_message:-unknown}."
          rollback() {
            if [ "$serving_changed" -eq 1 ] && [ -n "$OLD_VERSION" ]; then
              WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/rollback.ndjson" CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" \
                npx wrangler versions deploy "${OLD_VERSION}@100%" -c wrangler.jsonc -y >/dev/null 2>&1 || true
            fi
          }
          fail() {
            rollback
            gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "TRAIN2_WFM_ONB_TEAM_RELEASE: **FAIL_SAFE**\n\n$1\n\nPrevious Team version rollback was attempted if traffic may have changed. No Core, D1, Access-policy, route, custom-domain, Staff, learner, Visit, Attendance, or reward mutation was authorized."
            exit 1
          }

          if [ "$ALREADY_ACTIVE" != "true" ]; then
            serving_changed=1
            WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/version-deploy.ndjson" CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" \
              npx wrangler versions deploy "${TARGET_VERSION}@100%" -c wrangler.jsonc -y >/dev/null \
              || fail "Exact Train 2 traffic promotion failed."
          fi

          current="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/deployments" "${auth[@]}")" || fail "Cannot verify post-promotion Team traffic."
          active="$(jq -r '.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$current" | head -1)"
          [ "$active" = "$TARGET_VERSION" ] || fail "Exact Train 2 Team version is not active at 100%."
          domains="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/domains" "${auth[@]}")" || fail "Cannot verify post-promotion domains."
          for host in "$TOS_HOST" "$BO_HOST"; do
            jq -e --arg h "$host" --arg s "$TEAM_WORKER" '[.result[]? | select(.hostname==$h and .service==$s)] | length == 1' <<<"$domains" >/dev/null || fail "${host} attachment changed unexpectedly."
          done
          jq -e --arg s "$CORE_WORKER" '[.result[]? | select(.service==$s)] | length == 0' <<<"$domains" >/dev/null || fail "Core gained a custom domain."
          subdomain="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_WORKER}/subdomain" "${auth[@]}")" || fail "Cannot verify workers.dev state."
          jq -e '.result.enabled == false and .result.previews_enabled == false' <<<"$subdomain" >/dev/null || fail "Production Team workers.dev state changed."

          for host in "$TOS_HOST" "$BO_HOST"; do
            headers="$RUNNER_TEMP/${host}.headers"; : > "$headers"
            code="$(curl -sS --max-time 15 -D "$headers" -o /dev/null -w '%{http_code}' "https://${host}/" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
            challenge="$(awk 'BEGIN{IGNORECASE=1} /^www-authenticate:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")"
            case "$code" in
              302|303|307) [[ "$location" =~ cloudflareaccess\.com ]] || fail "${host} redirects outside Cloudflare Access." ;;
              401|403) [[ "$challenge" == *Cloudflare-Access* || -n "$challenge" ]] || fail "${host} denial lacks a recognizable Access challenge." ;;
              200) fail "${host} became publicly reachable without Cloudflare Access." ;;
              *) fail "${host} perimeter smoke returned unexpected HTTP ${code}." ;;
            esac
          done
          core_after="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/deployments" "${auth[@]}")" || fail "Cannot re-check Core dependency after Team rollout."
          core_after_version="$(jq -r '.result.deployments[0].versions[]? | select(.percentage==100) | .version_id // empty' <<<"$core_after" | head -1)"
          core_after_detail="$(curl -fsS "${api}/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CORE_WORKER}/versions/${core_after_version}" "${auth[@]}")" || fail "Cannot inspect Core dependency after Team rollout."
          core_after_message="$(jq -r '.result.annotations["workers/message"] // empty' <<<"$core_after_detail")"
          [ "$core_after_message" = "Train2 WFM-ONB Core production 840fed2f548f9b08db914bd3086b43a7b150283e base e9949c3da0106ad0973fff8fc8ae71d7fd68a135" ] || fail "Core serving state changed during Team rollout: ${core_after_message:-unknown}."
          serving_changed=0
          gh issue comment "$ISSUE_NUMBER" --repo "$repo" --body "TRAIN2_WFM_ONB_TEAM_RELEASE: **PASS**\n\n- Production base: ${PROD_BASE}\n- Candidate: ${TARGET_SHA}\n- Staging evidence mirror: #${{ steps.gate.outputs.evidence_issue }} PASS\n- Team Worker version: ${TARGET_VERSION}\n- Traffic: 100%\n- TOS + BO custom domains: preserved\n- Cloudflare Access perimeter smoke: PASS\n- Required private Core/Access bindings: preserved\n- workers.dev/previews: disabled\n\nHuman-authenticated production UX smoke remains an explicit post-release boundary. No Core runtime, D1, Access-policy, route, custom-domain, Staff, learner, Visit, Attendance, or reward mutation was performed by this Team operator."
