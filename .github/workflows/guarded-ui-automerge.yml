name: Guarded UI Native Auto Merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, review_requested, review_request_removed, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  admit:
    if: github.repository == 'vmtct/pino-team-os' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main policy only (never checkout PR code)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed path policy
        run: node --test scripts/guarded-ui-automerge.test.mjs
      - name: Admit only new, safe, same-repo UI PRs to GitHub-native auto merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/guarded-ui-automerge.mjs
