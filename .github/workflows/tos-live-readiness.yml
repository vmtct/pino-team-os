name: TOS Live Staff Readiness — RETIRED

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  retired:
    if: github.event.issue.title == '[GPT] TOS live staff readiness' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    steps:
      - name: Reject superseded readiness probe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "TOS_LIVE_STAFF_READINESS: **RETIRED_FAIL_CLOSED**\n\nExternal-identity and aggregate-D1 readiness cannot prove the canonical production local-password path. Use Core PRE_GA Production Local Auth Verification on exact Core/Team/Web heads and serving deployment IDs.\n\nNo production mutation was attempted."
          exit 1
