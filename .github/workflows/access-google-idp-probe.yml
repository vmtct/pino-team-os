name: Access Google IdP Probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event.issue.title == '[GPT] Access Google IdP probe' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
      GOOGLE_ACCESS_CLIENT_ID: ${{ secrets.GOOGLE_ACCESS_CLIENT_ID }}
      GOOGLE_ACCESS_CLIENT_SECRET: ${{ secrets.GOOGLE_ACCESS_CLIENT_SECRET }}
      TOS_AUD: 9cc2708f62a198982d0597f520529a457e2b055c1835f77119a35286ac8de051

    steps:
      - name: Read live IdP readiness
        shell: bash
        run: |
          set -euo pipefail
          fail() { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_GOOGLE_IDP_PROBE: **FAIL_SAFE**\n\n$1\n\nRead-only; no IdP, Access policy, runtime, route, or data mutation."; exit 1; }
          [ -n "${CF_ACCOUNT_ID:-}" ] || fail "CF_ACCOUNT_ID unavailable."
          [ -n "${CF_ACCESS_TOKEN:-}" ] || fail "CF_ACCESS_API_TOKEN unavailable."
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_ACCESS_TOKEN}" -H 'Content-Type: application/json')
          idps="$(curl -fsS "${api}/access/identity_providers" "${auth[@]}")" || fail "Cannot read identity providers."
          apps="$(curl -fsS "${api}/access/apps?per_page=100" "${auth[@]}")" || fail "Cannot read Access applications."
          jq -e '.success==true' <<<"$idps" >/dev/null || fail "Identity provider API returned failure."
          jq -e '.success==true' <<<"$apps" >/dev/null || fail "Access applications API returned failure."
          google_count="$(jq '[.result[]? | select(.type=="google")] | length' <<<"$idps")"
          workspace_count="$(jq '[.result[]? | select(.type=="google-apps")] | length' <<<"$idps")"
          otp_count="$(jq '[.result[]? | select(.type=="onetimepin")] | length' <<<"$idps")"
          types="$(jq -r '[.result[]?.type] | unique | join(",")' <<<"$idps")"
          google_names="$(jq -r '[.result[]? | select(.type=="google") | .name] | join(",")' <<<"$idps")"
          app="$(jq -c --arg aud "$TOS_AUD" '.result[]? | select((.aud // "") == $aud)' <<<"$apps" | head -1)"
          [ -n "$app" ] || fail "Pinned TOS app not found."
          allowed_count="$(jq '(.allowed_idps // []) | length' <<<"$app")"
          client_ready=false
          [ -n "${GOOGLE_ACCESS_CLIENT_ID:-}" ] && [ -n "${GOOGLE_ACCESS_CLIENT_SECRET:-}" ] && client_ready=true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "ACCESS_GOOGLE_IDP_PROBE: **PASS**\n\n- IdP types: ${types:-none}\n- Generic Google IdP count: ${google_count}\n- Google IdP names: ${google_names:-none}\n- Google Workspace IdP count: ${workspace_count}\n- One-time PIN IdP count: ${otp_count}\n- TOS explicit allowed_idps count: ${allowed_count}\n- Dedicated Google OAuth secrets ready: ${client_ready}\n\nNo client ID/secret values were printed. Read-only Zero Trust inspection only; no production mutation."
