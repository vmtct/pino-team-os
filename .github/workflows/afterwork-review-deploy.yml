name: Afterwork Review Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated review Worker
        run: npx wrangler deploy --config wrangler.afterwork-review.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
