name: Afterwork Review Deploy

on:
  push:
    branches: [prototype/afterwork-ops-v0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check review deployment credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare review deploy skipped: repository secrets are not configured yet."
          fi

      - name: Checkout
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: npm ci

      - name: Build OpenNext Worker
        if: steps.creds.outputs.available == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated review Worker
        if: steps.creds.outputs.available == 'true'
        run: npx wrangler deploy --config wrangler.afterwork-review.jsonc
