name: Greenfield BO Preview — isolated deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pino-greenfield-bo-preview-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5676c5179e0e9fb5dc743c4867da892f633c19b4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify frozen source and fail-closed staging isolation
        run: |
          test "$(git rev-parse HEAD)" = 5676c5179e0e9fb5dc743c4867da892f633c19b4
          node -e 'const c=require("./wrangler.greenfield-preview.json"); if(c.name!=="pino-team-os-greenfield-preview"||c.workers_dev!==false||c.preview_urls!==false||c.routes||c.route||c.vars?.FOUNDER_EMAIL!==""||Object.keys(c.vars||{}).some(k=>/BYPASS|INGRESS/.test(k))||c.services.length!==8||c.services.some(x=>x.service!=="pino-core-staging"))process.exit(1)'
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - run: test -f .open-next/worker.js
      - run: npx wrangler deploy --dry-run -c wrangler.greenfield-preview.json
      - name: Deploy worker with no public ingress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
        run: npx wrangler deploy -c wrangler.greenfield-preview.json --message 'greenfield-preview source=5676c5179e0e9fb5dc743c4867da892f633c19b4'
