name: Workforce Exception Staging E2E
run-name: "${{ github.event.issue.title == '[GPT] Workforce exception staging E2E' && github.event.issue.user.login == 'vmtct' && format('Workforce Exception Staging E2E #{0} @ {1}', github.event.issue.number, github.sha) || format('IGNORED Workforce Exception staging issue #{0} @ {1}', github.event.issue.number, github.sha) }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: pino-team-staging-worker-mutation
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event.issue.title == '[GPT] Workforce exception staging E2E' && github.event.issue.user.login == 'vmtct'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
      STAGING_URL: https://pino-team-os-staging.minhtri-van42.workers.dev
      PINO_STAGING_STAFF_EMAIL: ${{ secrets.PINO_STAGING_STAFF_EMAIL }}
      PINO_STAGING_STAFF_PASSWORD: ${{ secrets.PINO_STAGING_STAFF_PASSWORD }}

    steps:
      - name: Validate request
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          AUTH_BODY_HASH="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          echo "AUTH_BODY_HASH=$AUTH_BODY_HASH" >> "$GITHUB_ENV"
          reject() {
            {
              echo "WORKFORCE_EXCEPTION_STAGING_E2E: REJECTED"
              echo
              echo "$1"
              echo
              echo "No staging or production mutation was attempted."
            } > "$RUNNER_TEMP/reject.txt"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reject.txt"
            exit 1
          }
          mapfile -t sha_lines < <(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^TEAM_SHA:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p')
          [ "${#sha_lines[@]}" -eq 1 ] || reject "Issue body must contain exactly one TEAM_SHA line."
          team_sha="$(tr 'A-F' 'a-f' <<<"${sha_lines[0]}")"
          grep -Eq '^CONFIRM:[[:space:]]*RUN_WORKFORCE_EXCEPTION_STAGING_E2E[[:space:]]*$' <<<"$ISSUE_BODY" || reject "Missing explicit confirmation."

          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" || reject "Cannot resolve main."
          [ "$team_sha" = "$main_sha" ] || reject "Requested SHA is not current Team main."
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${team_sha}&event=push&per_page=30")"
          latest_main_validation="$(jq -c '[.workflow_runs[] | select(.name=="Cloudflare Build + Serving Truth")] | sort_by(.updated_at // .run_started_at // .created_at // "") | last // empty' <<<"$runs")"
          jq -e '.status=="completed" and .conclusion=="success"' <<<"$latest_main_validation" >/dev/null || reject "Newest current-main Team serving-truth workflow is not terminal success."

          echo "team_sha=$team_sha" >> "$GITHUB_OUTPUT"
          echo "TEAM_SHA=$team_sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.team_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact active staging serving revision
        id: staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "CF_API_TOKEN unavailable" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TEAM_SHA"
          test -z "$(git status --porcelain)"

          npx wrangler deployments status -c wrangler.staging.jsonc --json > "$RUNNER_TEMP/staging-active.json"
          deployment="$(cat "$RUNNER_TEMP/staging-active.json")"
          prefix="Workforce staging ${TEAM_SHA} run "
          message="$(jq -r '.annotations["workers/message"] // ""' <<<"$deployment")"
          [[ "$message" == "$prefix"* ]] || { echo "Current active staging deployment provenance does not match exact Team SHA" >&2; exit 1; }
          version_id="$(jq -r '.versions[]? | select(.percentage == 100) | .version_id // empty' <<<"$deployment" | head -1)"
          [ -n "$version_id" ] || { echo "Exact Team SHA is not active at 100% on pino-team-os-staging" >&2; exit 1; }
          run_id="${message##* run }"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Staging deployment run provenance is malformed" >&2; exit 1; }

          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "deploy_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Exact staging serving revision: $TEAM_SHA / $version_id / deploy run $run_id"

      - name: Revalidate authority immediately before Golden Journey writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Workforce exception staging E2E" "$AUTH_BODY_HASH"
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_main" = "$TEAM_SHA" ] || { echo "Team main drifted before Golden Journey mutation" >&2; exit 1; }

          npx wrangler deployments status -c wrangler.staging.jsonc --json > "$RUNNER_TEMP/staging-recheck.json"
          deployment="$(cat "$RUNNER_TEMP/staging-recheck.json")"
          prefix="Workforce staging ${TEAM_SHA} run "
          message="$(jq -r '.annotations["workers/message"] // ""' <<<"$deployment")"
          [ "$message" = "$prefix${{ steps.staging.outputs.deploy_run_id }}" ] || { echo "Current staging deployment provenance changed before Golden Journey mutation" >&2; exit 1; }
          jq -e --arg version "${{ steps.staging.outputs.version_id }}" 'any(.versions[]?; .percentage == 100 and .version_id == $version)' <<<"$deployment" >/dev/null || {
            echo "Staging serving revision changed before Golden Journey mutation" >&2
            exit 1
          }

      - name: Run cross-runtime Golden Journey
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
          STAGING_VERSION_ID: ${{ steps.staging.outputs.version_id }}
          STAGING_DEPLOY_RUN_ID: ${{ steps.staging.outputs.deploy_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${PINO_STAGING_STAFF_EMAIL:-}" ] && [ -n "${PINO_STAGING_STAFF_PASSWORD:-}" ] || { echo "Missing staging credentials" >&2; exit 1; }
          npx playwright test e2e/wfm-exc-staging.spec.ts --workers=1 --retries=0
      - name: Report PASS
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/assert-live-issue-authority.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "[GPT] Workforce exception staging E2E" "$AUTH_BODY_HASH"
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_main" = "$TEAM_SHA" ] || { echo "Team main drifted before staging PASS" >&2; exit 1; }

          npx wrangler deployments status -c wrangler.staging.jsonc --json > "$RUNNER_TEMP/staging-pass-recheck.json"
          deployment="$(cat "$RUNNER_TEMP/staging-pass-recheck.json")"
          prefix="Workforce staging ${TEAM_SHA} run "
          message="$(jq -r '.annotations["workers/message"] // ""' <<<"$deployment")"
          [ "$message" = "$prefix${{ steps.staging.outputs.deploy_run_id }}" ] || { echo "Current staging deployment provenance changed before PASS" >&2; exit 1; }
          jq -e --arg version "${{ steps.staging.outputs.version_id }}" 'any(.versions[]?; .percentage == 100 and .version_id == $version)' <<<"$deployment" >/dev/null || {
            echo "Staging serving revision changed before PASS" >&2
            exit 1
          }

          {
            echo "WORKFORCE_EXCEPTION_STAGING_E2E: PASS"
            echo
            echo "Team source: ${TEAM_SHA}"
            echo "Staging Worker: pino-team-os-staging"
            echo "Active staging version: ${{ steps.staging.outputs.version_id }}"
            echo "Staging deploy run: ${{ steps.staging.outputs.deploy_run_id }}"
            echo "Journey: request -> BO manager approval -> canonical eligible assignment handoff"
            echo "Runtimes: pino-team-os-staging -> pino-core-staging"
            echo "Golden Journey: GJ-WFM-EXCEPTION-01"
            echo
            echo "No Production mutation was performed."
          } > "$RUNNER_TEMP/pass.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pass.txt"

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            echo "WORKFORCE_EXCEPTION_STAGING_E2E: FAIL_SAFE"
            echo
            echo "Team source: ${TEAM_SHA:-unknown}"
            echo "No Production mutation was authorized by this workflow."
          } > "$RUNNER_TEMP/failure.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/failure.txt" || true
