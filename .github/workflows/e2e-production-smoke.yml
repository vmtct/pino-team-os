name: Production E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run production smoke test
        env:
          E2E_BASE_URL: https://pino-team-os.minhtri-van42.workers.dev
        run: node scripts/e2e-production-smoke.mjs
