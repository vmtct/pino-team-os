name: Production Perimeter Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unauthenticated production perimeter smoke
        env:
          E2E_BASE_URL: https://tos.pinohouse.art
        run: bun run test:e2e
      - name: Record authenticated rollout boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production smoke scope"
            echo
            echo "- Automated here: unauthenticated Cloudflare Access perimeter, retired team hostname, and disabled workers.dev bypass."
            echo "- Explicit rollout-only: authenticated TOS identity, self context, and own-schedule reads through an authorized Access session."
            echo "- BO is excluded until its domain and Access application are explicitly activated."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
