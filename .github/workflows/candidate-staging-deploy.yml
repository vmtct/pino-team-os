name: Team Staging CD (Guarded)
on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pino-team-staging-worker-mutation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'vmtct/pino-team-os' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'vmtct/pino-team-os'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      ACCOUNT: 952c3c8a236f8e4cbcf6ee10b86ad70c
      WORKER: pino-team-os-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Admit exact current main, successful push CI and staging-only artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$SHA"
          git merge-base --is-ancestor 93fde0193685cd465f4888c8cc0bc009252c7edd "$SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > /tmp/validation.json
          jq -e --arg sha "$SHA" '.head_sha==$sha and .event=="push" and .conclusion=="success" and .path==".github/workflows/pr-validation.yml"' /tmp/validation.json
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const c=require('./wrangler.ho-staging.json');
          assert.equal(c.name,'pino-team-os-staging');
          assert.equal(c.main,'worker.ho-staging.mjs');
          assert.equal(c.keep_vars,false);
          assert.equal(c.vars.APP_ENV,'staging');
          assert.equal(c.vars.BO_UI_ONLY,'enabled');
          assert.deepEqual(c.assets.run_worker_first,['/*']);
          assert.ok(!c.routes && !c.route && !c.send_email && !c.d1_databases && !c.r2_buckets);
          assert.ok(c.services.length>0 && c.services.every(s=>s.service==='pino-core-staging'));
          assert.ok(Object.keys(c.vars).every(k=>!/BYPASS|INGRESS/.test(k)));
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Verify BO contract, typecheck, build and dry-run
        run: |
          set -euo pipefail
          npm run bo:contract:check
          npm run typecheck
          npm run build
          npx opennextjs-cloudflare build
          test -s .open-next/worker.js
          node scripts/pap659-package-provenance.mjs .next .open-next/assets
          npx wrangler deploy --dry-run -c wrangler.ho-staging.json
      - name: CAS release, boundary smoke and guarded rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          get() { curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1/deployments?per_page=1"; }
          active() { get "$1" | jq -er 'if .success and (.result.deployments[0].versions|length==1) and .result.deployments[0].versions[0].percentage==100 then .result.deployments[0].versions[0].version_id else error("ambiguous deployment") end'; }
          # Pin live CAS within the serialized staging lane; fail closed on unsafe prior bindings.
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$SHA"
          PREVIOUS="$(active "$WORKER")"
          CORE_VERSION="$(active pino-core-staging)"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$WORKER/versions/$PREVIOUS" > previous-version.json
          jq -e '.success and ([.result.resources.bindings[]|select(.type=="send_email" or (.name|test("BYPASS|INGRESS")))]|length==0) and ([.result.resources.bindings[]|select(.type=="service")]|length>0 and all(.service=="pino-core-staging"))' previous-version.json
          test "$(active "$WORKER")" = "$PREVIOUS"
          test "$(active pino-core-staging)" = "$CORE_VERSION"
          get "$WORKER" > before.json
          message="team-cd-guarded staging sha=$SHA run=$GITHUB_RUN_ID"
          rollback() {
            current="$(get "$WORKER")" || return 1
            if jq -e --arg message "$message" '.result.deployments[0].annotations["workers/message"]==$message' <<<"$current" >/dev/null; then
              jq -n --arg previous "$PREVIOUS" --arg sha "$SHA" '{strategy:"percentage",versions:[{version_id:$previous,percentage:100}],annotations:{"workers/message":("team-cd guarded rollback from sha="+$sha)}}' > rollback.json
              curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @rollback.json "$api/$WORKER/deployments" | jq -e .success
              test "$(active "$WORKER")" = "$PREVIOUS"
            elif [ "$(active "$WORKER")" != "$PREVIOUS" ]; then
              echo 'Concurrent writer: refusing rollback' >&2
              return 1
            fi
          }
          trap 'result=$?; if [ "$result" -ne 0 ]; then rollback || echo "ROLLBACK_HOLD" >&2; fi; exit "$result"' EXIT
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$SHA"
          test "$(active "$WORKER")" = "$PREVIOUS"
          test "$(active pino-core-staging)" = "$CORE_VERSION"
          npx wrangler deploy -c wrangler.ho-staging.json --tag "team-cd-${SHA:0:12}" --message "$message"
          get "$WORKER" > after.json
          jq -e --arg message "$message" '.success and .result.deployments[0].annotations["workers/message"]==$message' after.json
          deployed="$(active "$WORKER")"
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$WORKER/versions/$deployed" > version.json
          jq -e '.success and ([.result.resources.bindings[]|select(.type=="service")]|length>0 and all(.service=="pino-core-staging")) and ([.result.resources.bindings[]|select(.type=="send_email" or (.name|test("BYPASS|INGRESS")))]|length==0) and ([.result.resources.bindings[]|select(.name=="APP_ENV" and .text=="staging")]|length==1)' version.json
          origin='https://pino-team-os-staging.minhtri-van42.workers.dev'
          # PAP-938 staging V4 stays protected; diagnostic route remains unavailable.
          test "$(curl -sS --max-time 20 -o /tmp/tos-v4-login -w '%{http_code}' "$origin/tos-v4")" = 307
          test "$(curl -sS --max-time 20 -o /tmp/tos-v4-anon -w '%{http_code}' "$origin/api/workforce/context")" = 401
          test "$(curl -sS --max-time 20 -o /tmp/tos-v4-prototype -w '%{http_code}' "$origin/prototype/tos-vnext-integration")" = 404
          for route in workforce-shift-plans workforce-availability workforce-assignments; do
            code="$(curl -sS --max-time 20 -o /tmp/pap901-login -w '%{http_code}' "$origin/bo/$route")"
            test "$code" = 307
          done
          # PAP-1030: retired BO pages must not be served, even by deep links.
          for route in workforce-term-weeks pinoria-world pinoria-ward pinoria-ward/sets system/users system/roles; do
            code="$(curl -sS --max-time 20 -o /tmp/pap1030-retired -w '%{http_code}' "$origin/bo/$route")"
            test "$code" = 404
          done
          for endpoint in bootstrap global-weeks weekly; do
            code="$(curl -sS --max-time 20 -o /tmp/pap901-anon -w '%{http_code}' "$origin/api/bo/workforce/planning/$endpoint")"
            test "$code" = 401
          done
          code="$(curl -sS --max-time 20 -o /tmp/pap901-ho-denied -w '%{http_code}' "$origin/ho")"
          test "$code" = 404
          for url in https://bo.staging.pinohouse.art/bo https://ho.staging.pinohouse.art/ho/centers; do
            code="$(curl -sS --max-time 20 -o /tmp/staging-login -w '%{http_code}' "$url")"
            test "$code" = 307
          done
          # PAP-1028: prevent silent BO CSS regressions (not just successful HTML route loads).
          for css in team-legacy-global.css bo-legacy-foundation.css; do
            curl -fsS --max-time 20 -D /tmp/bo-style-headers -o /tmp/bo-style-body "https://bo.staging.pinohouse.art/$css"
            test -s /tmp/bo-style-body
            grep -qi "^content-type: text/css" /tmp/bo-style-headers
          done
          curl -fsS --max-time 20 "$origin/api/health" | jq -e '.ok==true and .service=="pino-team-os"'
          digest="$(node -p "require('./.next/pap659-build-provenance.json').digest")"
          curl -fsS --max-time 20 "$origin/pap659-build-provenance.json" | jq -e --arg digest "$digest" '.digest==$digest'
          test "$(active "$WORKER")" = "$deployed"
          test "$(active pino-core-staging)" = "$CORE_VERSION"
          jq -n --arg sourceSha "$SHA" --arg previousVersionId "$PREVIOUS" --arg activeVersionId "$deployed" --arg coreVersion "$CORE_VERSION" --arg runId "$GITHUB_RUN_ID" '{kind:"TEAM_GUARDED_STAGING_CD",sourceSha:$sourceSha,previousVersionId:$previousVersionId,activeVersionId:$activeVersionId,coreVersion:$coreVersion,runId:$runId,result:"SERVING_BOUNDARY_PASS",productionMutation:false,authenticatedVisualAcceptance:"PENDING"}' > receipt.json
          cat receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-guarded-staging-cd-receipt
          path: |
            receipt.json
            before.json
            after.json
            rollback.json
            previous-version.json
          if-no-files-found: warn
