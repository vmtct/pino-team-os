name: Team Staging CD

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
  TEAM_STAGING_WORKER: pino-team-os-staging
  TEAM_STAGING_URL: https://pino-team-os-staging.minhtri-van42.workers.dev
  TEAM_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pino-team-staging-worker-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEAM_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact staging target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEAM_SHA"
          grep -q '"name": "pino-team-os-staging"' wrangler.staging.jsonc
          grep -q '"service": "pino-core-staging"' wrangler.staging.jsonc
      - name: Build deployable staging artifact
        run: |
          set -euo pipefail
          npm run build
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
      - name: Deploy, read back, smoke, and rollback safely on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Cloudflare API is the canonical deployment readback; Wrangler JSON shape differs.
          fetch_deployments() {
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${TEAM_STAGING_WORKER}/deployments?per_page=10"
          }

          active_version() {
            fetch_deployments | jq -er '
              if .success != true then error("Cloudflare deployments API failed") else
                [.result.deployments[0].versions[]? | select(.percentage == 100) | .version_id]
                | if length == 1 then .[0] else error("Expected exactly one active 100-percent version") end
              end'
          }

          previous_version="$(active_version)"
          test -n "$previous_version"
          message="staging sha=${TEAM_SHA} run=${GITHUB_RUN_ID}"
          active_message="$(fetch_deployments | jq -er 'if .success == true then (.result.deployments[0].annotations["workers/message"] // "") else error("Cloudflare deployments API failed") end')"
          deployed_this_run=false
          deployment_run_id="$GITHUB_RUN_ID"

          if [[ "$active_message" == "staging sha=${TEAM_SHA} run="* ]]; then
            echo "Active Worker already matches exact source SHA; reusing version and running smoke only"
            deployed_version="$previous_version"
            deployment_run_id="${active_message##* run=}"
          else
            short_sha="${TEAM_SHA:0:12}"
            npx wrangler deploy -c wrangler.staging.jsonc --tag "staging-${short_sha}" --message "$message"
            deployed_this_run=true
            fetch_deployments > deployment.json
            deployed_version="$(jq -er --arg m "$message" '
              if .success != true then error("Cloudflare deployments API failed") else
                .result.deployments[0] as $d
                | if $d.annotations["workers/message"] != $m then
                    error("Latest deployment does not match this run and SHA")
                  else
                    [$d.versions[]? | select(.percentage == 100) | .version_id]
                    | if length == 1 then .[0] else error("Expected exactly one deployed 100-percent version") end
                  end
              end' deployment.json)"
          fi
          test -n "$deployed_version"
          test "$(active_version)" = "$deployed_version"

          smoke_ok=true
          code="$(curl -sS --max-time 15 -o /tmp/bo-context.json -w '%{http_code}' "${TEAM_STAGING_URL}/api/bo/context" || true)"
          if [ "$code" != 401 ]; then
            smoke_ok=false
          elif ! jq -e '.error.code == "IDENTITY_AUTHENTICATION_FAILED"' /tmp/bo-context.json >/dev/null; then
            smoke_ok=false
          elif ! curl -fsS --max-time 15 "${TEAM_STAGING_URL}/bo/workforce" >/tmp/bo-workforce.html; then
            smoke_ok=false
          fi

          if [ "$smoke_ok" != true ]; then
            current_version="$(active_version)"
            if [ "$deployed_this_run" = true ] && [ "$current_version" = "$deployed_version" ]; then
              npx wrangler rollback "$previous_version" -c wrangler.staging.jsonc --message "staging rollback failed-sha=${TEAM_SHA} run=${GITHUB_RUN_ID}"
              test "$(active_version)" = "$previous_version"
            else
              echo "Not owner of active staging version or source already deployed; refusing rollback" >&2
            fi
            exit 1
          fi

          jq -n \
            --arg runtime team \
            --arg sourceSha "$TEAM_SHA" \
            --arg worker "$TEAM_STAGING_WORKER" \
            --arg previousVersionId "$previous_version" \
            --arg activeVersionId "$deployed_version" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg deploymentRunId "$deployment_run_id" \
            --arg reusedExistingDeployment "$([ "$deployed_this_run" = false ] && echo true || echo false)" \
            '{kind:"PINO_STAGING_RUNTIME_RECEIPT",runtime:$runtime,sourceSha:$sourceSha,worker:$worker,previousVersionId:$previousVersionId,activeVersionId:$activeVersionId,runId:$runId,deploymentRunId:$deploymentRunId,reusedExistingDeployment:($reusedExistingDeployment=="true"),smokeResult:"PASS",result:"PASS",productionMutation:false}' \
            | tee staging-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-team-receipt
          path: staging-receipt.json
