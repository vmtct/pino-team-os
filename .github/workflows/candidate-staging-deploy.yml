name: Team Staging CD

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CF_ACCOUNT_ID: 952c3c8a236f8e4cbcf6ee10b86ad70c
  TEAM_STAGING_WORKER: pino-team-os-staging
  TEAM_STAGING_URL: https://pino-team-os-staging.minhtri-van42.workers.dev
  TEAM_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pino-team-staging-worker-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEAM_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact staging target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEAM_SHA"
          grep -q '"name": "pino-team-os-staging"' wrangler.staging.jsonc
          grep -q '"service": "pino-core-staging"' wrangler.staging.jsonc
      - name: Build deployable staging artifact
        run: |
          set -euo pipefail
          npm run build
          npx opennextjs-cloudflare build
          test -f .open-next/worker.js
      - name: Deploy, read back, smoke, and rollback safely on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          active_version() {
            npx wrangler deployments list -c wrangler.staging.jsonc --json \
              | jq -r '.[0].versions[]? | select(.percentage==100) | .version_id' \
              | head -1
          }

          previous_version="$(active_version)"
          core_version="$(npx wrangler deployments list --name pino-core-staging --json | jq -r '.[0].versions[]? | select(.percentage==100) | .version_id' | head -1)"
          test -n "$previous_version"
          test -n "$core_version"

          short_sha="${TEAM_SHA:0:12}"
          message="staging sha=${TEAM_SHA} core=${core_version} run=${GITHUB_RUN_ID}"
          npx wrangler deploy -c wrangler.staging.jsonc --tag "staging-${short_sha}" --message "$message"

          npx wrangler deployments list -c wrangler.staging.jsonc --json > deployment.json
          deployed_version="$(jq -r --arg m "$message" '[.[] | select(.annotations["workers/message"]==$m)] | first | .versions[]? | select(.percentage==100) | .version_id' deployment.json)"
          test -n "$deployed_version"
          test "$(active_version)" = "$deployed_version"

          smoke_ok=true
          code="$(curl -sS --max-time 15 -o /tmp/bo-context.json -w '%{http_code}' "${TEAM_STAGING_URL}/api/bo/context" || true)"
          if [ "$code" != 401 ]; then
            smoke_ok=false
          elif ! jq -e '.error.code == "IDENTITY_AUTHENTICATION_FAILED"' /tmp/bo-context.json >/dev/null; then
            smoke_ok=false
          elif ! curl -fsS --max-time 15 "${TEAM_STAGING_URL}/bo/workforce" >/tmp/bo-workforce.html; then
            smoke_ok=false
          fi

          if [ "$smoke_ok" != true ]; then
            current_version="$(active_version)"
            if [ "$current_version" = "$deployed_version" ]; then
              npx wrangler rollback "$previous_version" -c wrangler.staging.jsonc --message "staging rollback failed-sha=${TEAM_SHA} run=${GITHUB_RUN_ID}"
              test "$(active_version)" = "$previous_version"
            else
              echo "Staging changed after this deployment; refusing rollback" >&2
            fi
            exit 1
          fi

          jq -n \
            --arg runtime team \
            --arg sourceSha "$TEAM_SHA" \
            --arg worker "$TEAM_STAGING_WORKER" \
            --arg previousVersionId "$previous_version" \
            --arg activeVersionId "$deployed_version" \
            --arg coreVersionId "$core_version" \
            --arg runId "$GITHUB_RUN_ID" \
            '{kind:"PINO_STAGING_RUNTIME_RECEIPT",runtime:$runtime,sourceSha:$sourceSha,worker:$worker,previousVersionId:$previousVersionId,activeVersionId:$activeVersionId,coreVersionId:$coreVersionId,runId:$runId,result:"PASS",productionMutation:false}' \
            | tee staging-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-team-receipt
          path: staging-receipt.json
