name: Afterwork Prototype Build

on:
  push:
    branches: [prototype/afterwork-ops-v0]
  pull_request:
    branches: [main]
    paths:
      - "app/founder/afterwork/**"
      - "app/afterwork-prototype/**"
      - "app/founder/layout.tsx"
      - ".github/workflows/afterwork-prototype-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
